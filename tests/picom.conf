# For tests/run.py: every trigger has a script, so picom's log says which one each move
# started. The scripts only have to exist. A window named plain has none for the causes.
# The rules have the shape of the README's example: geometry leaves out floating windows,
# and the causes are in a rule for all windows. The open and close scripts read the split
# line, which the frame log shows, and run long enough for the window to draw. A window
# named keeps closes in 3 s, drawn as it is, so the test can look at it.
animation-triggers = ["swirl"];
rules = ({
    match = "!I3_FLOATING_WINDOW@";
    animations = ({
        triggers = ["geometry"];
        offset-x = { duration = 0.05; start = 20; end = 0; };
    });
}, {
    match = "name != 'plain'";
    animations = (
        {
            triggers = ["moved-by-open"];
            offset-x = { duration = 0.05; start = 1; end = 0; };
        },
        {
            triggers = ["moved-by-close"];
            offset-x = { duration = 0.05; start = 2; end = 0; };
        },
        {
            triggers = ["moved-by-fullscreen"];
            offset-x = { duration = 0.05; start = 3; end = 0; };
        },
        {
            triggers = ["moved-by-float"];
            offset-x = { duration = 0.05; start = 4; end = 0; };
        },
        {
            triggers = ["covered-by-fullscreen"];
            offset-x = { duration = 0.05; start = 10; end = 0; };
        },
        {
            triggers = ["uncovered-by-fullscreen"];
            offset-x = { duration = 0.05; start = 11; end = 0; };
        },
        {
            triggers = ["swirl"];
            offset-x = { duration = 0.05; start = 5; end = 0; };
        },
        {
            triggers = ["open"];
            offset-x = { duration = 0.2; start = 6; end = 0; };
            var-line = "plugin-win-cause-line";
            var-line-x = "plugin-win-cause-line-x";
            var-line-y = "plugin-win-cause-line-y";
            var-line-width = "plugin-win-cause-line-width";
            var-line-height = "plugin-win-cause-line-height";
        },
        {
            triggers = ["close"];
            offset-x = { duration = 0.2; start = 7; end = 0; };
            var-line = "plugin-win-cause-line";
            var-line-x = "plugin-win-cause-line-x";
            var-line-y = "plugin-win-cause-line-y";
            var-line-width = "plugin-win-cause-line-width";
            var-line-height = "plugin-win-cause-line-height";
        },
        {
            triggers = ["show"];
            offset-x = { duration = 0.05; start = 8; end = 0; };
        },
        {
            triggers = ["hide"];
            offset-x = { duration = 0.05; start = 9; end = 0; };
        }
    );
}, {
    match = "name = 'keeps'";
    animations = ({
        triggers = ["close"];
        var-t = { duration = 3; start = 0; end = 1; };
        opacity = 1;
    });
});
