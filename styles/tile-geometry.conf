# The motion of tile.conf for the geometry trigger: a window that moves or changes size
# for a reason the win-cause plugin can't see (resize, swap, move, layout, floating off).
# For a rule that leaves floating windows out, next to tile.conf; see there.
animations = ({
  triggers = ["geometry"];
  # Windows may trade places here: with var-path 1 they bend past each other.
  var-pass = 1;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-rect.conf"
});
