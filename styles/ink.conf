# Ink: while a window moves it is colour, not content. Its picture drains into the middle
# of its box, the box moves in the window's median colour, and the picture comes back out
# at the new place (parts/ink-move.conf), also to another monitor. One that opens is a drop
# of its colour that grows from its middle, and then its content comes out; one that
# closes drains to colour, and then the block shrinks to a dot.
#
# picom can't fade a picture over its own backdrop (the window's opacity is theirs too),
# so the picture shrinks into the colour rather than fades.
#
# For the rule of tile.conf, in its place, with ink-geometry.conf in the rule of
# tile-geometry.conf. Length and colours are tile's (parts/tile.conf); a change takes 1.5
# times as long.
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  @include "win-cause/parts/ink-move.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  @include "win-cause/parts/ink-move.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/first-picture.conf"
  @include "win-cause/parts/ink-timing.conf"
  var-rx = "window-x + (1 - var-m) * window-width / 2";
  var-ry = "window-y + (1 - var-m) * window-height / 2";
  var-rw = "var-m * window-width";
  var-rh = "var-m * window-height";
  var-zs = 1;
  var-zx = 0;
  var-zy = 0;
  var-ps = "max(0.01, var-in)";
  var-pax = 0.5;
  var-pay = 0.5;
  var-pic = 0;
  var-bdk = 1;
  var-quad = 0;
  @include "win-cause/parts/themed-flat.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  @include "win-cause/parts/ink-timing.conf"
  var-g = { curve = "cubic-bezier(0.5, 0, 0.8, 0.4)"; delay = "0.3 * var-leni"; duration = "0.7 * var-leni"; start = 1; end = 0; reset = true; };
  var-rx = "window-x + (1 - var-g) * window-width / 2";
  var-ry = "window-y + (1 - var-g) * window-height / 2";
  var-rw = "var-g * window-width";
  var-rh = "var-g * window-height";
  var-zs = 1;
  var-zx = 0;
  var-zy = 0;
  var-ps = "max(0.01, var-out)";
  var-pax = 0.5;
  var-pay = 0.5;
  var-pic = 0;
  var-bdk = 1;
  var-quad = 0;
  # A closed window's own opacity is 0.
  opacity = "window-mapped-opacity";
  blur-opacity = "opacity";
  @include "win-cause/parts/themed-flat.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "1.5 * var-length";
  @include "win-cause/parts/cover.conf"
});
