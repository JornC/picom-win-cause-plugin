# Paper: windows are sheets of paper on a desk. A sheet that moves tilts into the way it
# goes, by its speed, and lies flat as it stops (parts/paper-move.conf); one that goes to
# another monitor is tossed in an arc with a slight spin. One that opens drops in from
# above its place and swings on its top edge like a hanging sign, less and less. One that
# closes tips over backwards and falls away downwards, faster and faster.
#
# For the rule of tile.conf, in its place, with paper-geometry.conf in the rule of
# tile-geometry.conf. Needs a picom with the corner outputs and crop-in-plane. Length is
# tile's (parts/tile.conf); an open takes 2.5 times as long, a close 1.5 times.
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  @include "win-cause/parts/paper-move.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  @include "win-cause/parts/paper-move.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/first-picture.conf"
  @include "win-cause/parts/tile-settings.conf"
  @include "win-cause/parts/themed-card-base.conf"
  var-q = { duration = "2.5 * var-length"; start = 0; end = 1; reset = true; };
  var-drop = { curve = "cubic-bezier(0.3, 0, 0.3, 1)"; duration = "var-length"; start = 1; end = 0; reset = true; };
  var-swing = { curve = "spring(280, 11)"; duration = "2.5 * var-length"; start = 0.7; end = 0; reset = true; };
  var-pic = 0;
  var-hw = "var-pw / 2";
  var-hh = "var-ph / 2";
  var-qcx = "window-x + var-hw";
  var-qcy = "window-y + var-hh - 0.4 * window-height * var-drop";
  var-ex = "window-x + var-hw";
  var-ey = "window-y + var-hh";
  # It hangs from its top edge.
  var-pu = 0;
  var-pv = "0 - var-hh";
  var-yaw = 0;
  var-roll = 0;
  var-pitch = "var-swing";
  var-cz = "max(0, 0 - 2 * var-hh * sin(var-pitch))";
  var-eye = 2;
  var-swap-x = 0;
  var-swap-y = 0;
  opacity = "window-raw-opacity * min(1, 10 * var-q)";
  blur-opacity = "opacity";
  @include "win-cause/parts/themed-flat.conf"
  @include "win-cause/parts/themed-card.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  @include "win-cause/parts/tile-settings.conf"
  @include "win-cause/parts/themed-card-base.conf"
  var-q = { duration = "1.5 * var-length"; start = 0; end = 1; reset = true; };
  var-tip = "min(1, 1.5 * var-q)";
  var-fall = "var-q * var-q";
  var-pic = 0;
  var-hw = "var-pw / 2";
  var-hh = "var-ph / 2";
  var-qcx = "window-x + var-hw";
  var-qcy = "window-y + var-hh + 0.5 * window-monitor-height * var-fall";
  var-ex = "window-x + var-hw";
  var-ey = "window-y + var-hh";
  # It tips over its bottom edge, its top going back.
  var-pu = 0;
  var-pv = "var-hh";
  var-yaw = 0;
  var-roll = 0;
  var-pitch = "0 - 1.35 * var-tip * var-tip";
  var-cz = 0;
  var-eye = 2;
  var-swap-x = 0;
  var-swap-y = 0;
  # A closed window's own opacity is 0.
  opacity = "window-mapped-opacity * min(1, 3 * (1 - var-q))";
  blur-opacity = "opacity";
  @include "win-cause/parts/themed-flat.conf"
  @include "win-cause/parts/themed-card.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "1.5 * var-length";
  @include "win-cause/parts/cover.conf"
});
