# Twirl: a window that opens spins in, var-turn of a turn in the plane of the screen, as it
# grows around its middle from var-from of its size to its size at its own proportions,
# and fades in over the first half; one that closes spins on the same way round as it
# shrinks and fades out. Windows that move do so as in tile.conf.
#
# For the rule of tile.conf, in its place; tile-geometry.conf stays. Needs a picom with the
# corner outputs. Length is tile's (parts/tile.conf).
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  var-pass = 0;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-rect.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  var-pass = 0;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-rect.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/first-picture.conf"
  @include "win-cause/parts/tile-settings.conf"
  var-from = 0.2;
  var-turn = 0.25;
  var-p = { curve = "cubic-bezier(0.2, 0.8, 0.3, 1)"; duration = "var-length"; start = 0; end = 1; reset = true; };
  var-s = "var-from + (1 - var-from) * var-p";
  var-phi = "-2 * pi * var-turn * (1 - var-p)";
  var-fade = { duration = "var-length / 2"; start = 0; end = 1; reset = true; };
  opacity = "window-raw-opacity * var-fade";
  @include "win-cause/parts/twirl.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  @include "win-cause/parts/tile-settings.conf"
  var-from = 0.2;
  var-turn = 0.25;
  var-p = { curve = "cubic-bezier(0.7, 0, 0.8, 0.2)"; duration = "var-length"; start = 0; end = 1; reset = true; };
  var-s = "1 - (1 - var-from) * var-p";
  var-phi = "2 * pi * var-turn * var-p";
  var-fade = { curve = "cubic-bezier(0.5, 0, 1, 1)"; duration = "var-length"; start = 1; end = 0; reset = true; };
  opacity = "window-mapped-opacity * var-fade";
  @include "win-cause/parts/twirl.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "var-length";
  @include "win-cause/parts/cover.conf"
});
