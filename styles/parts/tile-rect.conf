# Not a style: the motion of a window that moves or changes size, for tile.conf and
# tile-geometry.conf. Its rectangle goes from where the window was to where it is on
# var-curve, which the style sets (tile's is var-ease of parts/tile.conf); its picture is drawn at its own size, cut to the rectangle,
# and the part of the rectangle that it doesn't cover is filled with the window's colour
# (see parts/tile.conf). The picture is the one the window had when the change started or
# its newest, whichever covers more of the rectangle (var-picture in parts/tile.conf);
# until the program has drawn at its new size, its newest is its last.
@include "win-cause/parts/tile.conf"
@include "win-cause/parts/tile-shared.conf"
@include "win-cause/parts/tile-still.conf"
# Where the rectangle starts: where the window was before it moved (window-x +
# plugin-win-cause-sx, and likewise -sy, -sw and -sh), or where the tile animation that
# this interrupts had it. It is frozen in a timing function whose start and end are the
# same.
var-x0 = { duration = "var-length"; reset = true; start = "var-carried * var-rx-before + (1 - var-carried) * (window-x + plugin-win-cause-sx)"; end = "var-carried * var-rx-before + (1 - var-carried) * (window-x + plugin-win-cause-sx)"; };
var-y0 = { duration = "var-length"; reset = true; start = "var-carried * var-ry-before + (1 - var-carried) * (window-y + plugin-win-cause-sy)"; end = "var-carried * var-ry-before + (1 - var-carried) * (window-y + plugin-win-cause-sy)"; };
var-w0 = { duration = "var-length"; reset = true; start = "var-carried * var-rw-before + (1 - var-carried) * (window-width + plugin-win-cause-sw)"; end = "var-carried * var-rw-before + (1 - var-carried) * (window-width + plugin-win-cause-sw)"; };
var-h0 = { duration = "var-length"; reset = true; start = "var-carried * var-rh-before + (1 - var-carried) * (window-height + plugin-win-cause-sh)"; end = "var-carried * var-rh-before + (1 - var-carried) * (window-height + plugin-win-cause-sh)"; };
# Where it ends: where i3 put the window, which is where it is. Frozen too, as at an
# interruption picom runs this script once more with the window's new place.
@include "win-cause/parts/tile-end.conf"
# The speed it keeps from the animation it interrupts, in pixels per second.
var-vx = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-rx-before-speed"; end = "var-carried * var-interrupt * var-rx-before-speed"; };
var-vy = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-ry-before-speed"; end = "var-carried * var-interrupt * var-ry-before-speed"; };
var-vw = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-rw-before-speed"; end = "var-carried * var-interrupt * var-rw-before-speed"; };
var-vh = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-rh-before-speed"; end = "var-carried * var-interrupt * var-rh-before-speed"; };
#
# The way it goes (var-path in parts/tile.conf). At 0 straight. At 1 each edge goes on a
# quadratic Bezier curve through the same edge of a control rectangle, which is the
# midpoint rectangle M (the straight way) bent by two things. Where the old and new
# places overlap, it goes from M toward their overlap O, by how far O's centre lies off
# the line between the two centres, as a share of the most it can (a corner of the box
# they span): the window curves around the side O is on, and shrinks a little on the way,
# so two windows that trade places pass each other. Where they don't overlap, M moves to
# the left of the way the window goes (one going right goes up, one going left down), so
# that the centre is off the straight way by var-lift times the window's size across it,
# midway. The two weigh by how far the places overlap, as a share of how far the window
# goes along each axis, so neither starts at once as layouts vary a little. The arc also
# fades as an axis moves less than half the window's smaller size along it: where the
# centres nearly line up, the overlap's side means nothing. The control rectangle is
# shrunk around its centre into the box around the two places, so the rectangle stays in
# that box. A change that interrupts a tile animation keeps the side its window is on,
# so an undo goes back the way it came; any other goes to the left.
var-pdx = "var-x1 + var-w1 / 2 - var-x0 - var-w0 / 2";
var-pdy = "var-y1 + var-h1 / 2 - var-y0 - var-h0 / 2";
var-pshare = "min(1, min(max(0, min(var-x0 + var-w0, var-x1 + var-w1) - max(var-x0, var-x1)) / max(abs(var-pdx), 0.000001), max(0, min(var-y0 + var-h0, var-y1 + var-h1) - max(var-y0, var-y1)) / max(abs(var-pdy), 0.000001)))";
var-pf = "min(1, abs((max(var-x0, var-x1) + min(var-x0 + var-w0, var-x1 + var-w1) - 2 * var-x0 - var-w0) * var-pdy - (max(var-y0, var-y1) + min(var-y0 + var-h0, var-y1 + var-h1) - 2 * var-y0 - var-h0) * var-pdx) / max(2 * abs(var-pdx * var-pdy), 0.000001))";
var-pg = "min(1, min(2 * abs(var-pdx) / max(min(var-w0, var-w1), 0.000001), 2 * abs(var-pdy) / max(min(var-h0, var-h1), 0.000001)))";
var-parc = "var-pshare * var-pg * var-pf";
var-pcl = "(var-x0 + var-x1) / 2 + var-parc * (max(var-x0, var-x1) - (var-x0 + var-x1) / 2)";
var-pct = "(var-y0 + var-y1) / 2 + var-parc * (max(var-y0, var-y1) - (var-y0 + var-y1) / 2)";
var-pcr = "(var-x0 + var-w0 + var-x1 + var-w1) / 2 + var-parc * (min(var-x0 + var-w0, var-x1 + var-w1) - (var-x0 + var-w0 + var-x1 + var-w1) / 2)";
var-pcb = "(var-y0 + var-h0 + var-y1 + var-h1) / 2 + var-parc * (min(var-y0 + var-h0, var-y1 + var-h1) - (var-y0 + var-h0 + var-y1 + var-h1) / 2)";
var-plen = "max(sqrt(var-pdx * var-pdx + var-pdy * var-pdy), 0.000001)";
var-pnx = "var-pdy / var-plen";
var-pny = "(0 - var-pdx) / var-plen";
var-pside0x = { duration = "var-length"; reset = true; start = "var-carried * var-poffx-before"; end = "var-carried * var-poffx-before"; };
var-pside0y = { duration = "var-length"; reset = true; start = "var-carried * var-poffy-before"; end = "var-carried * var-poffy-before"; };
var-pside = "min(1, max(-1, 1 + 2 * (var-pside0x * var-pnx + var-pside0y * var-pny)))";
var-plift = "2 * (1 - var-pshare) * var-pside * var-lift * (abs(var-pnx) * (var-w0 + var-w1) / 2 + abs(var-pny) * (var-h0 + var-h1) / 2)";
var-pcx = "min(max(var-x0 + var-w0, var-x1 + var-w1), max(min(var-x0, var-x1), (var-pcl + var-pcr) / 2 + var-plift * var-pnx))";
var-pcy = "min(max(var-y0 + var-h0, var-y1 + var-h1), max(min(var-y0, var-y1), (var-pct + var-pcb) / 2 + var-plift * var-pny))";
var-phw = "max(0, min((var-pcr - var-pcl) / 2, min(var-pcx - min(var-x0, var-x1), max(var-x0 + var-w0, var-x1 + var-w1) - var-pcx)))";
var-phh = "max(0, min((var-pcb - var-pct) / 2, min(var-pcy - min(var-y0, var-y1), max(var-y0 + var-h0, var-y1 + var-h1) - var-pcy)))";
# How far each edge of the control rectangle is from the midpoint one. Only where the
# windows of a change may pass each other (var-pass, set by the rule that includes this):
# a change of i3's layout, not one in which windows only make room or take it. And not
# an edge on a seam: one that lies along a neighbour's, across the same gap, where they
# start and where they end (plugin-win-cause-seam-*), so tiles that stay neighbours
# never come apart; that edge goes straight.
var-seam-left = "plugin-win-cause-seam-left";
var-seam-top = "plugin-win-cause-seam-top";
var-seam-right = "plugin-win-cause-seam-right";
var-seam-bottom = "plugin-win-cause-seam-bottom";
var-pbl = "var-path * var-pass * (1 - var-seam-left) * (var-pcx - var-phw - (var-x0 + var-x1) / 2)";
var-pbt = "var-path * var-pass * (1 - var-seam-top) * (var-pcy - var-phh - (var-y0 + var-y1) / 2)";
var-pbr = "var-path * var-pass * (1 - var-seam-right) * (var-pcx + var-phw - (var-x0 + var-w0 + var-x1 + var-w1) / 2)";
var-pbb = "var-path * var-pass * (1 - var-seam-bottom) * (var-pcy + var-phh - (var-y0 + var-h0 + var-y1 + var-h1) / 2)";
# The same as a move and a change of size.
var-sbx = "var-pbl";
var-sby = "var-pbt";
var-sbw = "var-pbr - var-pbl";
var-sbh = "var-pbb - var-pbt";
var-pk = "2 * var-curve * (1 - var-curve)";
var-rx = "var-x0 + (var-x1 - var-x0) * var-curve + var-pk * var-sbx + var-vx * var-carry";
var-ry = "var-y0 + (var-y1 - var-y0) * var-curve + var-pk * var-sby + var-vy * var-carry";
var-rw = "var-w0 + (var-w1 - var-w0) * var-curve + var-pk * var-sbw + var-vw * var-carry";
var-rh = "var-h0 + (var-h1 - var-h0) * var-curve + var-pk * var-sbh + var-vh * var-carry";
# Where its centre is off the straight way, for the side of a change that interrupts it.
var-poffx = "var-rx + var-rw / 2 - var-x0 - var-w0 / 2 - var-pdx * var-curve";
var-poffy = "var-ry + var-rh / 2 - var-y0 - var-h0 / 2 - var-pdy * var-curve";
#
# The picture: var-ax, var-ay is its point at var-anchor-x, var-anchor-y, in screen
# coordinates, which sits at that point of the rectangle; var-px, var-py its top left.
# When this interrupts a tile animation, the picture starts where that one had it, and
# comes to its place on the same curves, so it doesn't jump either (after an open, whose
# picture stands still while its rectangle grows, it is elsewhere in the rectangle). Its
# top left is carried rather than its anchor point, as the anchor may differ between the
# two (see parts/tile-still.conf).
var-dx = { duration = "var-length"; reset = true; start = "var-carried * (var-px-before - var-rx-before - var-anchor-x * (var-rw-before - var-pw))"; end = "var-carried * (var-px-before - var-rx-before - var-anchor-x * (var-rw-before - var-pw))"; };
var-dy = { duration = "var-length"; reset = true; start = "var-carried * (var-py-before - var-ry-before - var-anchor-y * (var-rh-before - var-ph))"; end = "var-carried * (var-py-before - var-ry-before - var-anchor-y * (var-rh-before - var-ph))"; };
var-vdx = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * (var-px-before-speed - var-rx-before-speed - var-anchor-x * var-rw-before-speed)"; end = "var-carried * var-interrupt * (var-px-before-speed - var-rx-before-speed - var-anchor-x * var-rw-before-speed)"; };
var-vdy = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * (var-py-before-speed - var-ry-before-speed - var-anchor-y * var-rh-before-speed)"; end = "var-carried * var-interrupt * (var-py-before-speed - var-ry-before-speed - var-anchor-y * var-rh-before-speed)"; };
var-ax = "var-rx + var-anchor-x * var-rw + var-dx * (1 - var-curve) + var-vdx * var-carry";
var-ay = "var-ry + var-anchor-y * var-rh + var-dy * (1 - var-curve) + var-vdy * var-carry";
#
# Which picture: window-image-width is the size of the window's newest picture picom has,
# an older one until the program drew at its new size; window-saved-image-width that of
# the one it had when the change started, which picom keeps while this runs. var-pw,
# var-ph is the size of the one var-picture chooses.
var-pw = "var-picture * window-saved-image-width + (1 - var-picture) * window-image-width";
var-ph = "var-picture * window-saved-image-height + (1 - var-picture) * window-image-height";
var-px = "var-ax - var-anchor-x * var-pw";
var-py = "var-ay - var-anchor-y * var-ph";
#
# Drawn: that picture at its own size, cut to the rectangle, and the rest of the
# rectangle filled. picom draws the window manager's frame on the rectangle's edges, from
# the window's newest picture, so the picture's anchor point sits at that point of the
# inside of the frame too. A saved-image-blend of 1 draws the older picture in place of
# the newest, at its own size from the same place, and 0 the newest; never both.
saved-image-blend = "var-picture";
saved-image-own-size = 1;
scale-x = "window-image-width / window-width";
scale-y = "window-image-height / window-height";
offset-x = "var-px - window-x";
offset-y = "var-py - window-y";
crop-x = "var-rx";
crop-y = "var-ry";
crop-width = "var-rw";
crop-height = "var-rh";
# The window manager's frame (i3's border, or its title bar) on the rectangle's edges,
# where i3 would draw it; only the content inside it is cut or filled.
frame-on-crop = 1;
fill = "var-fill * var-fill-alpha";
fill-red = "var-fill-red";
fill-green = "var-fill-green";
fill-blue = "var-fill-blue";
# The backdrop starts where the tile animation that this interrupts had it, else at 0.
var-bd0 = { duration = "var-length"; reset = true; start = "var-carried * var-bd-before"; end = "var-carried * var-bd-before"; };
backdrop = "var-backdrop * var-bd * var-bd-alpha";
backdrop-red = "var-bd-red";
backdrop-green = "var-bd-green";
backdrop-blue = "var-bd-blue";
shadow-offset-x = "var-rx - window-x";
shadow-offset-y = "var-ry - window-y";
shadow-scale-x = "var-rw / window-width";
shadow-scale-y = "var-rh / window-height";
