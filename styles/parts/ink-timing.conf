# Not a style: the clock of ink.conf. A change takes var-leni. var-out goes from 1 to 0 in
# its first 30 %, as the picture drains into the colour, var-in from 0 to 1 in its last
# 30 %, as it comes back; var-m moves the colour block in between, on tile's curve.
@include "win-cause/parts/tile-settings.conf"
var-leni = "1.5 * var-length";
var-q = { duration = "var-leni"; start = 0; end = 1; reset = true; };
var-m = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; delay = "0.15 * var-leni"; duration = "0.7 * var-leni"; start = 0; end = 1; reset = true; };
var-oa = "min(1, var-q / 0.3)";
var-ia = "max(0, (var-q - 0.7) / 0.3)";
var-out = "1 - var-oa * var-oa * (3 - 2 * var-oa)";
var-in = "var-ia * var-ia * (3 - 2 * var-ia)";
