# Not a style: the camera of step-back.conf. A change takes var-lens. In its first third
# the camera pulls back, so every window of the change is drawn smaller by var-depth around
# the middle of its monitor, places and all; in its last third it comes back.
@include "win-cause/parts/tile-settings.conf"
var-depth = 0.15;
var-lens = "1.6 * var-length";
var-q = { duration = "var-lens"; start = 0; end = 1; reset = true; };
var-da = "min(1, 3 * var-q)";
var-ua = "max(0, 3 * var-q - 2)";
var-zs = "1 - var-depth * (var-da * var-da * (3 - 2 * var-da) - var-ua * var-ua * (3 - 2 * var-ua))";
var-zx = "window-monitor-x + window-monitor-width / 2";
var-zy = "window-monitor-y + window-monitor-height / 2";
# 0 to 1 in the middle third, for a window that opens or closes.
var-fa = "min(1, max(0, 3 * var-q - 1))";
var-fade = "var-fa * var-fa * (3 - 2 * var-fa)";
