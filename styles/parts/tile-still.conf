# Not a style: the point of a window that stays still while its rectangle goes from
# var-x0, var-y0, var-w0, var-h0 to var-x1, var-y1, var-w1, var-h1 (the parts that move a
# rectangle define these), as a share of the rectangle: 0 its left (top) edge, 1 its right
# (bottom) edge. Both edges move on the same curve, so that point is the same share of
# the rectangle all the way. On the curved way (var-path 1) the rectangle carries that
# point off the straight way and back, and the picture goes with it. A picture anchored
# there grows or shrinks around a point
# that doesn't move, so no edge of it goes back while the program catches up with its
# rectangle. When both edges go the same way no point stays still, and it is the edge
# that moves least; when the size doesn't change, the left (top) edge.
var-still-x = "min(1, max(0, (var-x0 - var-x1) * (var-w1 - var-w0) / max(0.000001, (var-w1 - var-w0) * (var-w1 - var-w0))))";
var-still-y = "min(1, max(0, (var-y0 - var-y1) * (var-h1 - var-h0) / max(0.000001, (var-h1 - var-h0) * (var-h1 - var-h0))))";
