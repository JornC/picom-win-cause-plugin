# Not a style: the curve of spring.conf and spring-geometry.conf. A damped spring pulls
# each rectangle to its place (picom's spring(stiffness, damping)): it goes about 4 % of
# the way past it at 0.27 s, settles back, and is within half a pixel of rest per 1000 px
# by 0.7 s, where the animation ends. It doesn't follow var-length.
var-curve = { curve = "spring(265, 23)"; duration = 0.7; start = 0; end = 1; reset = true; };
