# Not a style: a window that opens, for tile.conf. Its rectangle grows out of the line it
# split from its neighbours (plugin-win-cause-line-*), on var-curve (the style's), while
# they make room on the same curve; its picture stands at its place and shows as the
# rectangle uncovers it. A window with no split line grows out of a point of its place
# instead (var-lone-to, parts/tile-lone.conf): it is drawn whole, picture and frame scaled
# evenly with its rectangle. With var-lone-fade it fades in too.
@include "win-cause/parts/tile-defaults.conf"
@include "win-cause/parts/tile.conf"
@include "win-cause/parts/tile-shared.conf"
@include "win-cause/parts/tile-still.conf"
@include "win-cause/parts/tile-lone.conf"
var-far = "plugin-win-cause-line-far";
var-line = "plugin-win-cause-line * (1 - var-far * (1 - var-far-line))";
# Where it starts: the line, or for a window with no line its point (0 wide and high).
var-x0 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-line-x + (1 - var-line) * (window-x + var-lone-u * window-width)"; end = "var-line * plugin-win-cause-line-x + (1 - var-line) * (window-x + var-lone-u * window-width)"; };
var-y0 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-line-y + (1 - var-line) * (window-y + window-height / 2)"; end = "var-line * plugin-win-cause-line-y + (1 - var-line) * (window-y + window-height / 2)"; };
var-w0 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-line-width"; end = "var-line * plugin-win-cause-line-width"; };
var-h0 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-line-height"; end = "var-line * plugin-win-cause-line-height"; };
# Where it ends: where i3 put the window.
@include "win-cause/parts/tile-end.conf"
var-rx = "var-x0 + (var-x1 - var-x0) * var-curve";
var-ry = "var-y0 + (var-y1 - var-y0) * var-curve";
var-rw = "var-w0 + (var-w1 - var-w0) * var-curve";
var-rh = "var-h0 + (var-h1 - var-h0) * var-curve";
# The picture stands at its place: var-px, var-py is its top left, var-ax, var-ay its point
# at var-anchor-x, var-anchor-y (see parts/tile-rect.conf). What of the rectangle the
# picture doesn't cover is filled. It is drawn at var-ps of its own size: 1, or for a
# window with no line the share of its size its rectangle has, so all of it grows out of
# the point var-x0, var-y0.
var-ps = "1 - (1 - var-line) * (1 - var-curve)";
var-sx = { duration = "var-length"; reset = true; start = "window-x"; end = "window-x"; };
var-sy = { duration = "var-length"; reset = true; start = "window-y"; end = "window-y"; };
var-px = "var-x0 + var-ps * (var-sx - var-x0)";
var-py = "var-y0 + var-ps * (var-sy - var-y0)";
var-ax = "var-px + var-anchor-x * var-ps * window-image-width";
var-ay = "var-py + var-anchor-y * var-ps * window-image-height";
scale-x = "var-ps * window-image-width / window-width";
scale-y = "var-ps * window-image-height / window-height";
offset-x = "var-px - window-x";
offset-y = "var-py - window-y";
crop-x = "var-rx";
crop-y = "var-ry";
crop-width = "var-rw";
crop-height = "var-rh";
# The window manager's frame (i3's border, or its title bar) on the rectangle's edges,
# where i3 would draw it; only the content inside it is cut or filled. A window with no
# line has its frame in its picture, scaled with it: on the rectangle's edges its sides
# would be scaled only along their length, which stretches a title.
frame-on-crop = "var-line";
fill = "var-fill * var-fill-alpha";
fill-red = "var-fill-red";
fill-green = "var-fill-green";
fill-blue = "var-fill-blue";
# The backdrop is there at once: the window is new.
var-bd0 = 1;
backdrop = "var-backdrop * var-bd * var-bd-alpha";
backdrop-red = "var-bd-red";
backdrop-green = "var-bd-green";
backdrop-blue = "var-bd-blue";
opacity = "window-raw-opacity * (var-line + (1 - var-line) * (1 - var-lone-fade + var-lone-fade * var-ease))";
blur-opacity = "opacity";
shadow-opacity = "opacity";
shadow-offset-x = "var-rx - window-x";
shadow-offset-y = "var-ry - window-y";
shadow-scale-x = "var-rw / window-width";
shadow-scale-y = "var-rh / window-height";
