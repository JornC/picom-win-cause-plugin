# Not a style: the motion of origami.conf for a window that moves, drawn through its
# corners as its picture, at its own size or evenly smaller to fit its box. Three kinds:
# - a window that changes size turns half a turn about the middle of its box as it goes,
#   about an upright axis if it changes most across, else a level one. Past edge on it
#   shows its face again, as a card with the same face on both sides, and its newest
#   picture: the one it had going in turns away, and the newest turns in.
# - a window that keeps its size (a swap) folds over the line halfway to its new place, as
#   the side of a box: back into the screen, edge on at the line, and down on the other
#   side, the right way round.
# - a window that goes to another monitor folds away about its edge that faces where it
#   goes, and unfolds at its new place from the edge that faces where it came from.
@include "win-cause/parts/tile-settings.conf"
@include "win-cause/parts/themed-places.conf"
@include "win-cause/parts/themed-card-base.conf"
var-e = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; duration = "1.5 * var-length"; start = 0; end = 1; reset = true; };
# 0 in the first half, 1 in the second.
var-h2 = "min(1, floor(2 * var-e))";
var-pic = "1 - var-h2";
var-same = "1 - min(1, max(0, ceil(max(abs(var-w1 - var-w0), abs(var-h1 - var-h0)) - 1)))";
var-mc = "var-cross";
var-ms = "(1 - var-cross) * var-same";
var-mt = "1 - var-mc - var-ms";
# 1 for an upright axis or line.
var-bv = "min(1, max(0, ceil(abs(var-dcx) - abs(var-dcy) + 0.5)))";
var-vax = "min(1, max(0, ceil(abs(var-dcx) + abs(var-w1 - var-w0) - abs(var-dcy) - abs(var-h1 - var-h0) + 0.5)))";
var-sgx = "var-dcx / max(1, abs(var-dcx))";
var-sgy = "var-dcy / max(1, abs(var-dcy))";
# The turn: the box goes from the old place to the new one.
var-gx = "var-x0 + (var-x1 - var-x0) * var-e";
var-gy = "var-y0 + (var-y1 - var-y0) * var-e";
var-gw = "var-w0 + (var-w1 - var-w0) * var-e";
var-gh = "var-h0 + (var-h1 - var-h0) * var-e";
var-st = "min(1, min(var-gw / var-pw, var-gh / var-ph))";
var-bt = "pi * (var-e - var-h2)";
# The box side, and the fold to another monitor.
var-tb = "pi * var-e";
var-tc = "pi / 2 * (1 - abs(1 - 2 * var-e))";
var-sh = "1 - 2 * var-h2";
var-s0 = "min(1, min(var-w0 / var-pw, var-h0 / var-ph))";
var-s1 = "min(1, min(var-w1 / var-pw, var-h1 / var-ph))";
var-s = "var-mt * var-st + var-ms * var-s0 + var-mc * ((1 - var-h2) * var-s0 + var-h2 * var-s1)";
var-hw = "var-s * var-pw / 2";
var-hh = "var-s * var-ph / 2";
var-qcx = "var-mt * (var-gx + var-gw / 2) + var-ms * var-cx0 + var-mc * ((1 - var-h2) * var-cx0 + var-h2 * var-cx1)";
var-qcy = "var-mt * (var-gy + var-gh / 2) + var-ms * var-cy0 + var-mc * ((1 - var-h2) * var-cy0 + var-h2 * var-cy1)";
var-ex = "var-qcx + var-ms * var-dcx / 2";
var-ey = "var-qcy + var-ms * var-dcy / 2";
var-pu = "var-ms * var-bv * var-dcx / 2 + var-mc * var-sh * var-bv * var-sgx * var-hw";
var-pv = "var-ms * (1 - var-bv) * var-dcy / 2 + var-mc * var-sh * (1 - var-bv) * var-sgy * var-hh";
var-yaw = "var-mt * var-vax * var-bt - var-ms * var-bv * var-sgx * var-tb - var-mc * var-sh * var-bv * var-sgx * var-tc";
var-pitch = "var-mt * (1 - var-vax) * var-bt - var-ms * (1 - var-bv) * var-sgy * var-tb - var-mc * var-sh * (1 - var-bv) * var-sgy * var-tc";
var-roll = 0;
# A turn about the middle brings one edge forward: it stays at the screen.
var-cz = "var-mt * (var-hw * abs(sin(var-yaw)) + var-hh * abs(sin(var-pitch)))";
var-swap-x = "var-ms * var-bv * var-h2";
var-swap-y = "var-ms * (1 - var-bv) * var-h2";
var-eye = 2;
@include "win-cause/parts/themed-flat.conf"
@include "win-cause/parts/themed-card.conf"
