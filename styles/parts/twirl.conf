# Not a style: a window turned by var-phi in the plane of the screen and drawn at var-s of
# its picture's own size, around its middle, through its corners, for twirl.conf.
var-cx = "window-x + window-width / 2";
var-cy = "window-y + window-height / 2";
var-hw = "var-s * window-image-width / 2";
var-hh = "var-s * window-image-height / 2";
var-c = "cos(var-phi)";
var-n = "sin(var-phi)";
scale-x = "window-image-width / window-width";
scale-y = "window-image-height / window-height";
corner-top-left-x = "var-cx - var-hw * var-c + var-hh * var-n - window-x";
corner-top-left-y = "var-cy - var-hw * var-n - var-hh * var-c - window-y";
corner-top-right-x = "var-cx + var-hw * var-c + var-hh * var-n - window-x - window-image-width";
corner-top-right-y = "var-cy + var-hw * var-n - var-hh * var-c - window-y";
corner-bottom-left-x = "var-cx - var-hw * var-c - var-hh * var-n - window-x";
corner-bottom-left-y = "var-cy - var-hw * var-n + var-hh * var-c - window-y - window-image-height";
corner-bottom-right-x = "var-cx + var-hw * var-c - var-hh * var-n - window-x - window-image-width";
corner-bottom-right-y = "var-cy + var-hw * var-n + var-hh * var-c - window-y - window-image-height";
blur-opacity = "opacity";
shadow-opacity = "opacity";
