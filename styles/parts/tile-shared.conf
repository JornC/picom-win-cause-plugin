# Not a style: what the parts of the tile style share, so they move alike whatever made
# the windows move. Nobody needs to copy this file: the settings are in parts/tile.conf.
#
# var-on tells a tile animation from any other, whose variables read as 0, so var-carried
# is 1 when this one interrupts a tile animation. var-q is the time, evenly from 0 to 1.
# var-carry is how a speed carried over from an interrupted animation dies out: 0 at both
# ends, rising at 1 px per px/s at the start and flat at the end, so that a coordinate
# x0 + (x1 - x0) * var-ease + v * var-carry leaves x0 at speed v and comes to rest at x1.
# That is linear in x0, x1 and v, so an edge that two windows share stays shared: both move
# it on the same curve. var-picture-best is 1 if the picture a window had when the change
# started covers more of the rectangle than its newest, each at its own size. var-bd is how
# much of the backdrop is drawn: from var-bd0 where the animation starts, it rises to 1 in
# var-backdrop-fade of var-length, and falls to 0 at the end in as long.
var-on = 1;
var-carried = "var-on-before";
var-q = { duration = "var-length"; start = 0; end = 1; reset = true; };
var-carry = "var-length * var-q * (1 - var-q) ^ 2";
var-picture-best = "min(1, max(0, ceil(min(var-rw, window-saved-image-width) * min(var-rh, window-saved-image-height) - min(var-rw, window-image-width) * min(var-rh, window-image-height))))";
var-bd-rate = "1 / max(var-backdrop-fade, 0.000001)";
var-bd = "min(1, min(var-bd0 + var-q * var-bd-rate, (1 - var-q) * var-bd-rate))";
# Tiles pass each other while they move, and i3 restacks them at every change: no window
# comes in front of a moving tile that it overlaps until they are apart or the move ends, so
# none jumps on top while they pass.
keep-stacking = 1;
