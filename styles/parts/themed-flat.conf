# Not a style: a window drawn as a flat box, for the themed styles. The box is var-rx,
# var-ry, var-rw, var-rh, with i3's frame on its edges and the rest filled with the
# window's colour (parts/tile.conf). In it the picture, at var-ps of its own size, sits at
# var-pax, var-pay (0 top left, 0.5 middle). All of it is seen through a camera that
# scales by var-zs around var-zx, var-zy, so the picture is only ever scaled evenly.
# var-pic is 1 for the picture the window had when the change started, 0 for its newest;
# var-best is whichever covers more of the box. var-bdk is how much backdrop is drawn.
# With var-quad 1 the style draws the window through its corners (parts/themed-card.conf)
# instead: then there is no box, fill or backdrop.
var-best = "min(1, max(0, ceil(min(var-rw, window-saved-image-width) * min(var-rh, window-saved-image-height) - min(var-rw, window-image-width) * min(var-rh, window-image-height))))";
var-pw = "var-pic * window-saved-image-width + (1 - var-pic) * window-image-width";
var-ph = "var-pic * window-saved-image-height + (1 - var-pic) * window-image-height";
var-px = "var-rx + var-pax * (var-rw - var-ps * var-pw)";
var-py = "var-ry + var-pay * (var-rh - var-ps * var-ph)";
saved-image-blend = "var-pic";
saved-image-own-size = 1;
scale-x = "var-zs * var-ps * window-image-width / window-width";
scale-y = "var-zs * var-ps * window-image-height / window-height";
offset-x = "var-zx + var-zs * (var-px - var-zx) - window-x";
offset-y = "var-zy + var-zs * (var-py - var-zy) - window-y";
crop-x = "(1 - var-quad) * (var-zx + var-zs * (var-rx - var-zx)) - var-quad * 100000";
crop-y = "(1 - var-quad) * (var-zy + var-zs * (var-ry - var-zy)) - var-quad * 100000";
crop-width = "(1 - var-quad) * var-zs * var-rw + var-quad * 200000";
crop-height = "(1 - var-quad) * var-zs * var-rh + var-quad * 200000";
frame-on-crop = 1;
fill = "(1 - var-quad) * var-fill * var-fill-alpha";
fill-red = "var-fill-red";
fill-green = "var-fill-green";
fill-blue = "var-fill-blue";
backdrop = "(1 - var-quad) * var-backdrop * var-bdk * var-bd-alpha";
backdrop-red = "var-bd-red";
backdrop-green = "var-bd-green";
backdrop-blue = "var-bd-blue";
