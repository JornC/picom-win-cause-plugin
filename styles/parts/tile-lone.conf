# Not a style: the point a window with no split line grows out of when it opens and shrinks
# into when it closes (var-lone-to of parts/tile.conf). Down, it is the window's middle;
# across, var-lone-u: 0 its left side, 0.5 its middle, 1 its right side. Its side toward
# the outside of the desk is the left one on a monitor that starts at the left edge of the
# screen, else the right one. A script sees only its window's monitor (window-monitor-x and
# the others), so on the only monitor that is the left side too, and on a monitor between
# two others the right one.
var-lone-u = "0.5 + var-lone-to * (min(1, max(0, ceil(window-monitor-x))) - 0.5)";
