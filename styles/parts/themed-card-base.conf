# Not a style: the box of parts/themed-flat.conf for a style that draws a window only as a
# card (parts/themed-card.conf): its picture at its own size where it is, no camera.
var-rx = "window-x";
var-ry = "window-y";
var-rw = "window-image-width";
var-rh = "window-image-height";
var-zs = 1;
var-zx = 0;
var-zy = 0;
var-ps = 1;
var-pax = 0;
var-pay = 0;
var-bdk = 0;
var-quad = 1;
