# Not a style: a window that a fullscreen window covers or uncovers, for the triggers
# covered-by-fullscreen and uncovered-by-fullscreen. Every style has it, in a rule of its
# own. Such a window goes nowhere: i3 hides it while the fullscreen window covers it, and
# shows it again when that window is no longer fullscreen or closes. So it stays as it is,
# where it is, while the window that goes fullscreen moves over it, and is gone only once
# that move ends and covers it. Uncovered, it is there at once, under the window that moves
# back to its place or closes, whatever order i3 stacks them in: it lies farther from the
# viewer than that window, whose moved-by-fullscreen and close animations set depth 0.
#
# The style that includes this sets var-cover-time, how long its moves and closes take in
# seconds, at most.
var-cover = { duration = "var-cover-time"; start = 0; end = 1; };
opacity = "window-mapped-opacity";
depth = 1;
