# Not a style: the motion of cards.conf for a window that moves. The window is a card: its
# box lifts (grows by var-lift-by around its middle, picture and all), slides to its new
# place and drops. A window that goes to another monitor is flicked: it shoots off fast
# and slows down at its new place, spinning var-spin-turns of a turn on the way, drawn
# through its corners as its picture, at its own size or evenly smaller to fit its box.
@include "win-cause/parts/tile-settings.conf"
@include "win-cause/parts/themed-places.conf"
var-lift-by = 0.03;
var-spin-turns = 1;
var-lenc = "1.4 * var-length";
var-q = { duration = "var-lenc"; start = 0; end = 1; reset = true; };
var-slide = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; delay = "0.2 * var-lenc"; duration = "0.6 * var-lenc"; start = 0; end = 1; reset = true; };
var-flick = { curve = "cubic-bezier(0.1, 0.7, 0.25, 1)"; duration = "var-lenc"; start = 0; end = 1; reset = true; };
var-m = "(1 - var-cross) * var-slide + var-cross * var-flick";
var-up = "min(1, min(var-q, 1 - var-q) / 0.2)";
var-rx = "var-x0 + (var-x1 - var-x0) * var-m";
var-ry = "var-y0 + (var-y1 - var-y0) * var-m";
var-rw = "var-w0 + (var-w1 - var-w0) * var-m";
var-rh = "var-h0 + (var-h1 - var-h0) * var-m";
var-zs = "1 + var-lift-by * var-up * var-up * (3 - 2 * var-up)";
var-zx = "var-rx + var-rw / 2";
var-zy = "var-ry + var-rh / 2";
var-ps = 1;
var-pax = "var-anchor-x";
var-pay = "var-anchor-y";
var-pic = "var-best";
var-bdk = "min(1, 4 * min(var-q, 1 - var-q))";
var-quad = "var-cross";
var-s = "min(1, min(var-rw / var-pw, var-rh / var-ph))";
var-hw = "var-s * var-pw / 2";
var-hh = "var-s * var-ph / 2";
var-qcx = "var-rx + var-rw / 2";
var-qcy = "var-ry + var-rh / 2";
var-ex = "var-qcx";
var-ey = "var-qcy";
var-pu = 0;
var-pv = 0;
var-cz = 0;
var-yaw = 0;
var-pitch = 0;
var-roll = "2 * pi * var-spin-turns * min(1, max(-1, var-dcx / 100)) * var-flick";
var-eye = 2;
var-swap-x = 0;
var-swap-y = 0;
@include "win-cause/parts/themed-flat.conf"
@include "win-cause/parts/themed-card.conf"
