# Not a style: a window drawn as one face of a box, for cube.conf: its picture, var-pic
# (1 the one it had when the change started, 0 its newest), as a flat card turned in 3D
# through its corners (parts/themed-card.conf, which says what the part sets), cut to
# var-cut-x, var-cut-y, var-cut-width, var-cut-height on the screen. The card is var-hw by
# var-hh from its middle: the picture's own size, or evenly smaller, so it is never
# stretched.
var-quad = 1;
var-pw = "var-pic * window-saved-image-width + (1 - var-pic) * window-image-width";
var-ph = "var-pic * window-saved-image-height + (1 - var-pic) * window-image-height";
saved-image-blend = "var-pic";
saved-image-own-size = 1;
scale-x = "window-image-width / window-width";
scale-y = "window-image-height / window-height";
offset-x = 0;
offset-y = 0;
crop-x = "var-cut-x";
crop-y = "var-cut-y";
crop-width = "var-cut-width";
crop-height = "var-cut-height";
@include "win-cause/parts/themed-card.conf"
