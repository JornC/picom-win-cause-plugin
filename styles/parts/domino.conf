# Not a style: the curve of domino.conf: tile's, from 0 to 1 in var-length, after a delay
# of up to var-domino seconds by where the window starts across its monitor, 0 at the
# left edge and var-domino at the right.
var-domino = 0.12;
var-curve = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; delay = "var-domino * min(1, max(0, (window-x + plugin-win-cause-sx - window-monitor-x) / max(1, window-monitor-width - window-width - plugin-win-cause-sw)))"; duration = "var-length"; start = 0; end = 1; reset = true; };
