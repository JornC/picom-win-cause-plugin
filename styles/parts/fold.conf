# Not a style: a window turned by var-a away from the eye, about its line
# (plugin-win-cause-line-*) or, with none, about its top edge, seen in perspective through
# its corners, for fold.conf and origami.conf. The eye is in front of the middle of the
# axis, var-eye of the window's larger side away. Each side of the axis goes back, so a
# window whose line lies inside it folds both halves back as one flat card. A window with
# no line turns only if var-lone-turn (the style's) is 1. At 0 it lies flat, and is drawn
# evenly at var-s of its size around its point of parts/tile-lone.conf: the share of the
# quarter turn it has left, so it grows out of that point as it would unfold, and shrinks
# into it as it would fold away.
@include "win-cause/parts/tile-lone.conf"
var-eye = 2;
var-line = "plugin-win-cause-line";
var-turns = "1 - (1 - var-line) * (1 - var-lone-turn)";
var-s = "1 - (1 - var-turns) * 2 * var-a / pi";
# 1 for an upright line (0 wide), about which the window turns sideways.
var-vert = "var-line * (1 - min(1, ceil(plugin-win-cause-line-width)))";
var-ax = "plugin-win-cause-line-x";
var-ay = "var-line * plugin-win-cause-line-y + (1 - var-line) * window-y";
var-d = "var-eye * max(window-image-width, window-image-height)";
var-c = "cos(var-turns * var-a)";
var-n = "sin(var-turns * var-a)";
var-l = "window-x";
var-r = "window-x + window-image-width";
var-t = "window-y";
var-b = "window-y + window-image-height";
var-mx = "window-x + window-image-width / 2";
var-my = "window-y + window-image-height / 2";
var-sx = "var-l + var-lone-u * window-image-width";
# About an upright axis at var-ax: an edge at x goes to var-ax + (x - var-ax) * cos, and
# |x - var-ax| * sin back, where the eye sees it var-k of its size from the axis.
var-kl = "var-d / (var-d + abs(var-l - var-ax) * var-n)";
var-kr = "var-d / (var-d + abs(var-r - var-ax) * var-n)";
var-xl = "var-ax + (var-l - var-ax) * var-c * var-kl";
var-xr = "var-ax + (var-r - var-ax) * var-c * var-kr";
# About a level axis at var-ay, the same.
var-kt = "var-d / (var-d + abs(var-t - var-ay) * var-n)";
var-kb = "var-d / (var-d + abs(var-b - var-ay) * var-n)";
var-yt = "var-ay + (var-t - var-ay) * var-c * var-kt";
var-yb = "var-ay + (var-b - var-ay) * var-c * var-kb";
scale-x = "window-image-width / window-width";
scale-y = "window-image-height / window-height";
# A corner at x, y goes to var-sx + (x - var-sx) * var-s, var-my + (y - var-my) * var-s
# after it turns; a window that turns has var-s 1.
corner-top-left-x = "var-s * (var-vert * (var-xl - var-l) + (1 - var-vert) * (var-mx + (var-l - var-mx) * var-kt - var-l)) + (1 - var-s) * (var-sx - var-l)";
corner-top-left-y = "var-s * (var-vert * (var-my + (var-t - var-my) * var-kl - var-t) + (1 - var-vert) * (var-yt - var-t)) + (1 - var-s) * (var-my - var-t)";
corner-top-right-x = "var-s * (var-vert * (var-xr - var-r) + (1 - var-vert) * (var-mx + (var-r - var-mx) * var-kt - var-r)) + (1 - var-s) * (var-sx - var-r)";
corner-top-right-y = "var-s * (var-vert * (var-my + (var-t - var-my) * var-kr - var-t) + (1 - var-vert) * (var-yt - var-t)) + (1 - var-s) * (var-my - var-t)";
corner-bottom-left-x = "var-s * (var-vert * (var-xl - var-l) + (1 - var-vert) * (var-mx + (var-l - var-mx) * var-kb - var-l)) + (1 - var-s) * (var-sx - var-l)";
corner-bottom-left-y = "var-s * (var-vert * (var-my + (var-b - var-my) * var-kl - var-b) + (1 - var-vert) * (var-yb - var-b)) + (1 - var-s) * (var-my - var-b)";
corner-bottom-right-x = "var-s * (var-vert * (var-xr - var-r) + (1 - var-vert) * (var-mx + (var-r - var-mx) * var-kb - var-r)) + (1 - var-s) * (var-sx - var-r)";
corner-bottom-right-y = "var-s * (var-vert * (var-my + (var-b - var-my) * var-kr - var-b) + (1 - var-vert) * (var-yb - var-b)) + (1 - var-s) * (var-my - var-b)";
