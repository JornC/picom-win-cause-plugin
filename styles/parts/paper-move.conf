# Not a style: the motion of paper.conf for a window that moves. The window is a sheet:
# its box, which slides from its old place to its new one, its size and shape changing
# with it, and tilts into the way it goes (its leading edge back), more the faster it
# goes, and lies flat again as it stops. A window that goes to another monitor is
# tossed: it goes up in an arc and turns a little in the screen's plane. On the sheet,
# as on tile's rectangle, the window's newest picture sits at its own size from the
# sheet's anchor (var-anchor-x, var-anchor-y), cut by the sheet where it is larger and
# filled with the window's colour where it is smaller (parts/tile.conf), with i3's
# frame on the sheet's edges. Needs a picom with crop-in-plane.
@include "win-cause/parts/tile-settings.conf"
@include "win-cause/parts/themed-places.conf"
@include "win-cause/parts/tile-still.conf"
@include "win-cause/parts/themed-card-base.conf"
var-tilt = 0.14;
var-toss = 0.15;
var-spin = 0.2;
var-q = { duration = "var-length"; start = 0; end = 1; reset = true; };
var-m = "var-q * var-q * (3 - 2 * var-q)";
# The speed of var-m, 1 at its fastest.
var-v = "4 * var-q * (1 - var-q)";
var-gx = "var-x0 + (var-x1 - var-x0) * var-m";
var-gy = "var-y0 + (var-y1 - var-y0) * var-m";
var-gw = "var-w0 + (var-w1 - var-w0) * var-m";
var-gh = "var-h0 + (var-h1 - var-h0) * var-m";
var-pic = 0;
# The sheet is the box; the picture in it is at its own size.
var-hw = "var-gw / 2";
var-hh = "var-gh / 2";
var-rx = "var-gx";
var-ry = "var-gy";
var-rw = "var-gw";
var-rh = "var-gh";
var-pax = "var-anchor-x";
var-pay = "var-anchor-y";
var-dirx = "min(1, max(-1, var-dcx / 800))";
var-diry = "min(1, max(-1, var-dcy / 800))";
var-qcx = "var-gx + var-gw / 2";
var-qcy = "var-gy + var-gh / 2 - var-cross * var-toss * window-monitor-height * 4 * var-m * (1 - var-m)";
var-ex = "var-qcx";
var-ey = "var-qcy";
var-pu = 0;
var-pv = 0;
var-yaw = "var-tilt * var-dirx * var-v";
var-pitch = "var-tilt * var-diry * var-v";
var-roll = "var-cross * var-spin * var-dirx * sin(pi * var-m)";
# The edge that comes forward stays at the screen, so the sheet is never drawn larger.
var-cz = "var-hw * abs(sin(var-yaw)) + var-hh * abs(sin(var-pitch))";
var-eye = 2;
var-swap-x = 0;
var-swap-y = 0;
@include "win-cause/parts/themed-flat.conf"
@include "win-cause/parts/themed-card.conf"
# The picture's sides on the sheet, from its middle.
var-ku0 = "var-px - var-gx - var-gw / 2";
var-ku1 = "var-ku0 + var-pw";
var-kv0 = "var-py - var-gy - var-gh / 2";
var-kv1 = "var-kv0 + var-ph";
# The sheet, in the window's plane as it lies flat: cut there, filled and framed.
crop-x = "var-gx";
crop-y = "var-gy";
crop-width = "var-gw";
crop-height = "var-gh";
crop-in-plane = 1;
fill = "var-fill * var-fill-alpha";
