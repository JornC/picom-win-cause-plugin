# Not a style: a window drawn at var-s of its picture's own size, around its middle, for
# pop.conf.
scale-x = "var-s * window-image-width / window-width";
scale-y = "var-s * window-image-height / window-height";
offset-x = "(window-width - var-s * window-image-width) / 2";
offset-y = "(window-height - var-s * window-image-height) / 2";
blur-opacity = "opacity";
shadow-opacity = "opacity";
