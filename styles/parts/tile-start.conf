# Not a style: where a window's rectangle starts in a change, as var-x0, var-y0, var-w0
# and var-h0: where the plugin says it starts (plugin-win-cause-sx and the others).
# Frozen, as picom runs a script once more at an interruption.
var-x0 = { duration = "var-length"; reset = true; start = "window-x + plugin-win-cause-sx"; end = "window-x + plugin-win-cause-sx"; };
var-y0 = { duration = "var-length"; reset = true; start = "window-y + plugin-win-cause-sy"; end = "window-y + plugin-win-cause-sy"; };
var-w0 = { duration = "var-length"; reset = true; start = "window-width + plugin-win-cause-sw"; end = "window-width + plugin-win-cause-sw"; };
var-h0 = { duration = "var-length"; reset = true; start = "window-height + plugin-win-cause-sh"; end = "window-height + plugin-win-cause-sh"; };
