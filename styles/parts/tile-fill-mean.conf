# Not a style: the colour of the fill and the backdrop of the tile style, which
# parts/tile.conf chooses.
# The mean colour of the window's content, as picom works it out on the GPU or in the X
# server ahead of a change (text and other small parts move it: tile-fill-median.conf
# has the colour of the background), and as opaque as the content is on the whole, so
# the part of a rectangle that the picture doesn't cover looks like the window, and a
# translucent window stays as translucent. None while picom doesn't know it.
var-fill-red = "window-mean-red";
var-fill-green = "window-mean-green";
var-fill-blue = "window-mean-blue";
var-fill-alpha = "window-mean-known * window-mean-alpha";
# The backdrop: the mean colour of the content, with its alpha, or while picom doesn't
# know it, that of the last window of the same program (WM_CLASS) whose mean picom knew,
# or the style's.
var-bd-red = "window-mean-known * window-mean-red + (1 - window-mean-known) * (window-class-mean-known * window-class-mean-red + (1 - window-class-mean-known) * var-backdrop-red)";
var-bd-green = "window-mean-known * window-mean-green + (1 - window-mean-known) * (window-class-mean-known * window-class-mean-green + (1 - window-class-mean-known) * var-backdrop-green)";
var-bd-blue = "window-mean-known * window-mean-blue + (1 - window-mean-known) * (window-class-mean-known * window-class-mean-blue + (1 - window-class-mean-known) * var-backdrop-blue)";
var-bd-alpha = "window-mean-known * window-mean-alpha + (1 - window-mean-known) * (window-class-mean-known * window-class-mean-alpha + (1 - window-class-mean-known) * var-backdrop-alpha)";
