# Not a style: the motion of cube.conf for a window that moves, drawn as a face of a box
# (parts/cube-face.conf), at its own size or evenly smaller to fit its place. Two kinds:
# - a window that keeps its size and moves on its monitor, where the rule sets var-swaps
#   to 1 (a swap: two windows trade places), is one of two sides of a box whose axis lies
#   behind the line between them, halfway along the way. The two sides fold back into
#   the near corner of the box at that line, the box turns a quarter, and its other
#   corner opens out flat. The window that goes right (or down) rides across the front;
#   the other one goes round the back: it turns away at one side till edge on, and comes
#   back at the other side, as the box's next face, with its newest picture. A box can't
#   swap two flat sides that face the eye, so they fold into a box and out again.
# - one whose old and new places overlap (their rectangles intersect) turns over in
#   place: half a turn about its middle as its box goes from the old place to the new
#   one, about an upright axis if it changes most across, else a level one, as origami's
#   window that changes size. Past edge on it shows its newest picture. A box can't tip
#   over an edge onto a place that overlaps the one it leaves.
# - any other: the window rolls a quarter turn about its edge in the way it goes, as a
#   box tipping onto its next side: it turns back about that edge till edge on, and the
#   next side, with its newest picture, comes down at its new place and size from its
#   edge that faces where it came from. A window that goes to another monitor tips over
#   toward it so; it doesn't count as a swap, even if it keeps its size.
@include "win-cause/parts/tile-settings.conf"
@include "win-cause/parts/themed-places.conf"
var-e = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; duration = "1.5 * var-length"; start = 0; end = 1; reset = true; };
# 0 in the first half, 1 in the second.
var-h2 = "min(1, floor(2 * var-e))";
var-same = "1 - min(1, max(0, ceil(max(abs(var-w1 - var-w0), abs(var-h1 - var-h0)) - 1)))";
var-moves = "min(1, max(0, ceil(max(abs(var-dcx), abs(var-dcy)) - 1)))";
# 0 for a window that neither moves nor changes size: it stays flat.
var-go = "max(var-moves, 1 - var-same)";
var-ms = "var-swaps * (1 - var-cross) * var-same * var-moves";
var-mr = "1 - var-ms";
# 1 where the old and new places overlap: a turn in place (var-mo), else a roll (var-ml).
var-ov = "min(1, max(0, ceil(min(min(var-x0 + var-w0, var-x1 + var-w1) - max(var-x0, var-x1), min(var-y0 + var-h0, var-y1 + var-h1) - max(var-y0, var-y1)))))";
var-mo = "var-mr * var-ov";
var-ml = "var-mr * (1 - var-ov)";
# 1 for an upright axis or edge. The way it goes across and down: 1 or -1, 1 if it
# doesn't move that way.
var-bv = "min(1, max(0, ceil(abs(var-dcx) - abs(var-dcy) + 0.5)))";
var-sgx = "1 - 2 * min(1, max(0, ceil(0 - var-dcx)))";
var-sgy = "1 - 2 * min(1, max(0, ceil(0 - var-dcy)))";
# A swap: 1 for the window that rides the front of the box.
var-front = "(1 + var-bv * var-sgx + (1 - var-bv) * var-sgy) / 2";
var-pic = "(1 - var-ms * var-front) * (1 - var-h2)";
var-s0 = "min(1, min(var-w0 / var-pw, var-h0 / var-ph))";
var-s1 = "min(1, min(var-w1 / var-pw, var-h1 / var-ph))";
# The turn in place: its box goes on var-e, its picture evenly smaller to fit it.
var-tx = "var-x0 + (var-x1 - var-x0) * var-e";
var-ty = "var-y0 + (var-y1 - var-y0) * var-e";
var-tw = "var-w0 + (var-w1 - var-w0) * var-e";
var-th = "var-h0 + (var-h1 - var-h0) * var-e";
var-st = "min(1, min(var-tw / var-pw, var-th / var-ph))";
var-vax = "min(1, max(0, ceil(abs(var-dcx) + abs(var-w1 - var-w0) - abs(var-dcy) - abs(var-h1 - var-h0) + 0.5)))";
var-bt = "var-go * pi * (var-e - var-h2)";
var-s = "var-mo * var-st + (1 - var-mo) * ((1 - var-h2) * var-s0 + var-h2 * var-s1)";
var-hw = "var-s * var-pw / 2";
var-hh = "var-s * var-ph / 2";
# The swap's box. Its two sides along the turn: this window's, and the other's, which is
# as long as this one's way (they lie side by side). The front side turns by var-ta: from 0
# to an eighth of a turn one way, to an eighth the other way, and back to 0. The back one
# turns by var-tb: half a turn, edge on midway. The corner between them is flat at the
# ends, square where the box shows a corner and midway, and within 10 degrees of square
# in between. The box's middle stays back so that its nearest corner is at the screen.
var-lo = "var-bv * 2 * var-hw + (1 - var-bv) * 2 * var-hh";
var-lp = "var-bv * abs(var-dcx) + (1 - var-bv) * abs(var-dcy)";
var-la = "var-front * var-lo + (1 - var-front) * var-lp";
var-lb = "var-front * var-lp + (1 - var-front) * var-lo";
var-ta = "0 - pi / 4 * sin(2 * pi * var-e)";
var-tb = "pi * var-e";
var-bx = "(var-cx0 + var-cx1) / 2";
var-by = "(var-cy0 + var-cy1) / 2";
var-bz = "(var-la * abs(sin(var-ta)) + var-lb * sin(var-tb)) / 2";
# This window's face: its middle along the turn from the box's middle, its depth, its turn.
var-back = "(1 - var-front) * (1 - 2 * var-h2)";
var-fu = "var-back * var-la / 2 * cos(var-ta) - var-front * var-lb / 2 * cos(var-tb)";
var-fz = "var-bz + var-back * var-la / 2 * sin(var-ta) - var-front * var-lb / 2 * sin(var-tb)";
var-ft = "var-front * var-ta + (1 - var-front) * (var-tb - pi * var-h2)";
# The roll: a quarter turn about the edge it goes toward in the first half, and one about
# the edge toward where it came from in the second. In each half its picture sits in that
# half's place as tile's does (var-anchor-x, var-anchor-y).
var-sh = "1 - 2 * var-h2";
var-tc = "var-go * pi / 2 * (1 - abs(1 - 2 * var-e))";
var-gx = "(1 - var-h2) * var-x0 + var-h2 * var-x1";
var-gy = "(1 - var-h2) * var-y0 + var-h2 * var-y1";
var-gw = "(1 - var-h2) * var-w0 + var-h2 * var-w1";
var-gh = "(1 - var-h2) * var-h0 + var-h2 * var-h1";
var-rcx = "var-gx + var-anchor-x * (var-gw - 2 * var-hw) + var-hw";
var-rcy = "var-gy + var-anchor-y * (var-gh - 2 * var-hh) + var-hh";
var-qcx = "var-ms * (var-bv * (var-bx + var-fu) + (1 - var-bv) * var-cx0) + var-ml * var-rcx + var-mo * (var-tx + var-tw / 2)";
var-qcy = "var-ms * (var-bv * var-cy0 + (1 - var-bv) * (var-by + var-fu)) + var-ml * var-rcy + var-mo * (var-ty + var-th / 2)";
var-pu = "var-ml * var-sh * var-bv * var-sgx * var-hw";
var-pv = "var-ml * var-sh * (1 - var-bv) * var-sgy * var-hh";
var-yaw = "var-bv * (var-ms * var-ft - var-ml * var-sh * var-sgx * var-tc) + var-mo * var-vax * var-bt";
var-pitch = "(1 - var-bv) * (var-ms * var-ft - var-ml * var-sh * var-sgy * var-tc) + var-mo * (1 - var-vax) * var-bt";
# A turn about the middle brings one edge forward: it stays at the screen.
var-cz = "var-ms * var-fz + var-mo * (var-hw * abs(sin(var-yaw)) + var-hh * abs(sin(var-pitch)))";
var-roll = 0;
var-swap-x = 0;
var-swap-y = 0;
# The eye: in front of the box's middle, twice its largest side away, the same for both
# sides of a swap; for a roll, in front of the window's middle.
var-ex = "var-ms * (var-bv * var-bx + (1 - var-bv) * var-cx0) + var-ml * var-rcx + var-mo * var-qcx";
var-ey = "var-ms * (var-bv * var-cy0 + (1 - var-bv) * var-by) + var-ml * var-rcy + var-mo * var-qcy";
var-side = "max(2 * var-hw, 2 * var-hh)";
var-eye = "2 * (var-ms * max(var-lp, var-side) + var-mr * var-side) / max(1, var-side)";
var-cut-x = -100000;
var-cut-y = -100000;
var-cut-width = 200000;
var-cut-height = 200000;
@include "win-cause/parts/cube-face.conf"
