# Not a style: the motion of warp.conf. In the first half of var-length the window sinks
# into the middle of its old place, and in the second it bursts out of the middle of its
# new one, at var-s: a box at var-s of the place, with i3's frame on its edges, and in it
# the picture at var-s of its own size, from the box's top left (var-anchor-x and
# var-anchor-y of parts/tile.conf). The part of the box the picture doesn't cover is filled
# with the window's colour, as in tile.conf. It sinks with the picture it had when it
# started (picom keeps it while this runs) and comes out with its newest. It fades with
# its size.
@include "win-cause/parts/tile-settings.conf"
@include "win-cause/parts/tile-start.conf"
@include "win-cause/parts/tile-end.conf"
var-q = { duration = "var-length"; start = 0; end = 1; reset = true; };
var-half = "min(1, floor(2 * var-q))";
var-sink = { curve = "cubic-bezier(0.6, 0, 0.9, 0.6)"; duration = "var-length / 2"; start = 1; end = 0; reset = true; };
var-burst = { curve = "cubic-bezier(0.1, 0.4, 0.4, 1)"; delay = "var-length / 2"; duration = "var-length / 2"; start = 0; end = 1; reset = true; };
var-s = "(1 - var-half) * var-sink + var-half * var-burst";
# The place of this half, and the box at var-s of it around its middle.
var-cx = "(1 - var-half) * (var-x0 + var-w0 / 2) + var-half * (var-x1 + var-w1 / 2)";
var-cy = "(1 - var-half) * (var-y0 + var-h0 / 2) + var-half * (var-y1 + var-h1 / 2)";
var-bw = "var-s * ((1 - var-half) * var-w0 + var-half * var-w1)";
var-bh = "var-s * ((1 - var-half) * var-h0 + var-half * var-h1)";
var-bx = "var-cx - var-bw / 2";
var-by = "var-cy - var-bh / 2";
# The picture of this half, at var-s of its own size.
var-pw = "var-s * ((1 - var-half) * window-saved-image-width + var-half * window-image-width)";
var-ph = "var-s * ((1 - var-half) * window-saved-image-height + var-half * window-image-height)";
saved-image-blend = "1 - var-half";
saved-image-own-size = 1;
scale-x = "var-s * window-image-width / window-width";
scale-y = "var-s * window-image-height / window-height";
offset-x = "var-bx + var-anchor-x * (var-bw - var-pw) - window-x";
offset-y = "var-by + var-anchor-y * (var-bh - var-ph) - window-y";
crop-x = "var-bx";
crop-y = "var-by";
crop-width = "var-bw";
crop-height = "var-bh";
frame-on-crop = 1;
fill = "var-fill * var-fill-alpha";
fill-red = "var-fill-red";
fill-green = "var-fill-green";
fill-blue = "var-fill-blue";
opacity = "window-mapped-opacity * var-s";
blur-opacity = "opacity";
shadow-opacity = "opacity";
