# Not a style: the colour of the fill and the backdrop of the tile style, which
# parts/tile.conf chooses.
# The median colour of the window's content, as picom works it out on the GPU or in the X
# server ahead of a change: the colour of more than half of it, so a terminal's text
# doesn't change it, and as opaque as that, so the part of a rectangle that the picture
# doesn't cover looks like the window's background, and a translucent window stays as
# translucent. None while picom doesn't know it.
var-fill-red = "window-median-red";
var-fill-green = "window-median-green";
var-fill-blue = "window-median-blue";
var-fill-alpha = "window-median-known * window-median-alpha";
# The backdrop: the median colour of the content, with its alpha, or while picom doesn't
# know it, that of the last window of the same program (WM_CLASS) whose median picom
# knew, or the style's.
var-bd-red = "window-median-known * window-median-red + (1 - window-median-known) * (window-class-median-known * window-class-median-red + (1 - window-class-median-known) * var-backdrop-red)";
var-bd-green = "window-median-known * window-median-green + (1 - window-median-known) * (window-class-median-known * window-class-median-green + (1 - window-class-median-known) * var-backdrop-green)";
var-bd-blue = "window-median-known * window-median-blue + (1 - window-median-known) * (window-class-median-known * window-class-median-blue + (1 - window-class-median-known) * var-backdrop-blue)";
var-bd-alpha = "window-median-known * window-median-alpha + (1 - window-median-known) * (window-class-median-known * window-class-median-alpha + (1 - window-class-median-known) * var-backdrop-alpha)";
