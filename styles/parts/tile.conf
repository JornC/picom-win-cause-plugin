# Not a style: the parts of the tile style include this. It holds the settings they share,
# so the windows of one change move alike whatever made them move. To change a setting,
# copy this file to win-cause/parts/ next to picom.conf.
#   var-length     how long a change takes, in seconds
#   var-ease       the curve every window of a change moves on, from 0 to 1 in var-length;
#                  one that starts and ends without speed keeps the motion smooth where a
#                  change starts, where it ends, and where it interrupts another
#   var-path       0 a rectangle goes straight; 1 in a change of i3's layout it curves around
#                  where its old and new places overlap, or bends left of its way where not
#   var-lift       with var-path 1, how far off its way a window whose places don't overlap
#                  goes midway, as a share of its size across the way
#   var-interrupt  a change that comes while one runs: 1 keeps the speed each rectangle
#                  has and slows it to rest at its new place; 0 starts var-ease again from
#                  where the rectangle is
#   var-fill       how much of the part of a rectangle that the window's picture doesn't
#                  cover is filled with the colour of the picture's edge: 1 all of it, 0
#                  none (what lies behind shows)
#   var-anchor-x   where a picture that doesn't fit its rectangle sits in it: 0 with its
#                  left edge on the rectangle's left edge, 1 with its right edge on the
#                  right edge, 0.5 in the middle; by default the point of the window that
#                  stays still in the change (var-still-x, see parts/tile-still.conf), so
#                  no edge of the picture goes back while the program catches up
#   var-anchor-y   the same, 0 for the top edge and 1 for the bottom edge (var-still-y)
#   var-lone-fade  a window that opens or closes with no split line (the first on its
#                  workspace, a floating one, a new tab): 1 fades in or out in var-length,
#                  0 comes or goes at once
#   var-far-line   a window that shares no split line with its neighbours goes into its
#                  far side (plugin-win-cause-line-far): 1 grows out of it or shrinks into
#                  it as into a split line, 0 goes as one with no line (var-lone-fade)
#   var-picture    which of a moving window's pictures is drawn in each frame: 1 the one
#                  it had when the change started, 0 its newest (the one the program
#                  drew at its new size, as soon as it has); by default var-picture-best,
#                  whichever covers more of the rectangle, each at its own size from the
#                  rectangle's anchor (see var-anchor-x), so the fill fills only what
#                  neither covers: a window that grows shows its newest picture as soon
#                  as it is drawn, and one that shrinks keeps its old picture, cut by the
#                  rectangle, until it lands. It switches in one frame; a value between 0
#                  and 1 would blend the two, and draw the frame with the picture rather
#                  than on the rectangle's edges
var-length = 0.25;
var-ease = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; duration = "var-length"; start = 0; end = 1; reset = true; };
var-path = 0;
var-lift = 0.08;
var-interrupt = 1;
var-fill = 1;
var-anchor-x = "var-still-x";
var-anchor-y = "var-still-y";
var-lone-fade = 1;
var-far-line = 1;
var-picture = "var-picture-best";
