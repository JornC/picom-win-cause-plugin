# Not a style: a window that closes, for tile.conf. The windows that take its place reach
# into it on var-curve (the style's), and it shows the part of its place they haven't
# reached yet: its rectangle is its place, cut to a rect that shrinks from their edges
# into the line where they end (plugin-win-cause-from-* and -line-*), on the same curve.
# So it is cut where they reach in every frame, also when windows next to it close with
# it; picom draws its last picture, which stays where it was. A window with no line (or
# with a far side, if var-far-line is 0) keeps its rectangle and fades out
# (var-lone-fade).
@include "win-cause/parts/tile.conf"
@include "win-cause/parts/tile-shared.conf"
@include "win-cause/parts/tile-still.conf"
var-far = "plugin-win-cause-line-far";
var-line = "plugin-win-cause-line * (1 - var-far * (1 - var-far-line))";
# Where the rectangle starts: the window's place, or where the tile animation that this
# interrupts had it, with the speed it had there.
var-x0 = { duration = "var-length"; reset = true; start = "var-carried * var-rx-before + (1 - var-carried) * window-x"; end = "var-carried * var-rx-before + (1 - var-carried) * window-x"; };
var-y0 = { duration = "var-length"; reset = true; start = "var-carried * var-ry-before + (1 - var-carried) * window-y"; end = "var-carried * var-ry-before + (1 - var-carried) * window-y"; };
var-w0 = { duration = "var-length"; reset = true; start = "var-carried * var-rw-before + (1 - var-carried) * window-width"; end = "var-carried * var-rw-before + (1 - var-carried) * window-width"; };
var-h0 = { duration = "var-length"; reset = true; start = "var-carried * var-rh-before + (1 - var-carried) * window-height"; end = "var-carried * var-rh-before + (1 - var-carried) * window-height"; };
var-x1 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-line-x + (1 - var-line) * window-x"; end = "var-line * plugin-win-cause-line-x + (1 - var-line) * window-x"; };
var-y1 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-line-y + (1 - var-line) * window-y"; end = "var-line * plugin-win-cause-line-y + (1 - var-line) * window-y"; };
var-w1 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-line-width + (1 - var-line) * window-width"; end = "var-line * plugin-win-cause-line-width + (1 - var-line) * window-width"; };
var-h1 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-line-height + (1 - var-line) * window-height"; end = "var-line * plugin-win-cause-line-height + (1 - var-line) * window-height"; };
var-vx = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-rx-before-speed"; end = "var-carried * var-interrupt * var-rx-before-speed"; };
var-vy = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-ry-before-speed"; end = "var-carried * var-interrupt * var-ry-before-speed"; };
var-vw = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-rw-before-speed"; end = "var-carried * var-interrupt * var-rw-before-speed"; };
var-vh = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-rh-before-speed"; end = "var-carried * var-interrupt * var-rh-before-speed"; };
# The rect that shrinks into the line: from where the windows that take the place start;
# with no line, one so large that it cuts nothing.
var-fx0 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-from-x + (1 - var-line) * window-x"; end = "var-line * plugin-win-cause-from-x + (1 - var-line) * window-x"; };
var-fy0 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-from-y + (1 - var-line) * window-y"; end = "var-line * plugin-win-cause-from-y + (1 - var-line) * window-y"; };
var-fw0 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-from-width + (1 - var-line) * window-width"; end = "var-line * plugin-win-cause-from-width + (1 - var-line) * window-width"; };
var-fh0 = { duration = "var-length"; reset = true; start = "var-line * plugin-win-cause-from-height + (1 - var-line) * window-height"; end = "var-line * plugin-win-cause-from-height + (1 - var-line) * window-height"; };
var-cl = "var-line * (var-fx0 + (var-x1 - var-fx0) * var-curve) - (1 - var-line) * 100000";
var-ct = "var-line * (var-fy0 + (var-y1 - var-fy0) * var-curve) - (1 - var-line) * 100000";
var-cr = "var-line * (var-fx0 + var-fw0 + (var-x1 + var-w1 - var-fx0 - var-fw0) * var-curve) + (1 - var-line) * 100000";
var-cb = "var-line * (var-fy0 + var-fh0 + (var-y1 + var-h1 - var-fy0 - var-fh0) * var-curve) + (1 - var-line) * 100000";
# The window's place, which moves with the picture if it was moving (see below).
var-ox = "var-x0 + var-vx * var-carry";
var-oy = "var-y0 + var-vy * var-carry";
var-or = "var-x0 + var-w0 + (var-vx + var-vw) * var-carry";
var-ob = "var-y0 + var-h0 + (var-vy + var-vh) * var-carry";
var-rx = "max(var-ox, var-cl)";
var-ry = "max(var-oy, var-ct)";
var-rw = "max(0, min(var-or, var-cr) - var-rx)";
var-rh = "max(0, min(var-ob, var-cb) - var-ry)";
# The picture stays where it was drawn, and slows to rest there if it was moving: var-px,
# var-py is its top left, var-ax, var-ay its point at var-anchor-x, var-anchor-y (see
# parts/tile-rect.conf).
var-px0 = { duration = "var-length"; reset = true; start = "var-carried * var-px-before + (1 - var-carried) * window-x"; end = "var-carried * var-px-before + (1 - var-carried) * window-x"; };
var-py0 = { duration = "var-length"; reset = true; start = "var-carried * var-py-before + (1 - var-carried) * window-y"; end = "var-carried * var-py-before + (1 - var-carried) * window-y"; };
var-vpx = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-px-before-speed"; end = "var-carried * var-interrupt * var-px-before-speed"; };
var-vpy = { duration = "var-length"; reset = true; start = "var-carried * var-interrupt * var-py-before-speed"; end = "var-carried * var-interrupt * var-py-before-speed"; };
var-px = "var-px0 + var-vpx * var-carry";
var-py = "var-py0 + var-vpy * var-carry";
var-ax = "var-px + var-anchor-x * window-image-width";
var-ay = "var-py + var-anchor-y * window-image-height";
scale-x = "window-image-width / window-width";
scale-y = "window-image-height / window-height";
offset-x = "var-px - window-x";
offset-y = "var-py - window-y";
crop-x = "var-rx";
crop-y = "var-ry";
crop-width = "var-rw";
crop-height = "var-rh";
# The window manager's frame (i3's border, or its title bar) on the rectangle's edges,
# where i3 would draw it; only the content inside it is cut or filled.
frame-on-crop = 1;
# A rectangle that shrinks has no gap, but one that was interrupted while it grew may.
fill = "window-edge-known * var-fill";
fill-red = "window-edge-red";
fill-green = "window-edge-green";
fill-blue = "window-edge-blue";
opacity = "window-mapped-opacity * (var-line + (1 - var-line) * (1 - var-lone-fade * var-ease))";
blur-opacity = "opacity";
shadow-opacity = "opacity";
shadow-offset-x = "var-rx - window-x";
shadow-offset-y = "var-ry - window-y";
shadow-scale-x = "var-rw / window-width";
shadow-scale-y = "var-rh / window-height";
