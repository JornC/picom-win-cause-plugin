# Not a style: the motion of step-back.conf for a window that moves: its box goes from its
# old place to its new one while the camera is back (parts/step-back-camera.conf), with
# i3's frame on its edges, its picture at its own size and the rest in its colour, as in
# tile.conf. Its picture is the one it had when the change started until mid-way, with the
# camera back, then its newest. Until the program drew its new size, picom's
# newest is the old one, so a slower program's new picture comes as soon as it drew.
@include "win-cause/parts/step-back-camera.conf"
@include "win-cause/parts/themed-places.conf"
var-m = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; delay = "0.2 * var-lens"; duration = "0.6 * var-lens"; start = 0; end = 1; reset = true; };
var-rx = "var-x0 + (var-x1 - var-x0) * var-m";
var-ry = "var-y0 + (var-y1 - var-y0) * var-m";
var-rw = "var-w0 + (var-w1 - var-w0) * var-m";
var-rh = "var-h0 + (var-h1 - var-h0) * var-m";
var-ps = 1;
var-pax = "var-anchor-x";
var-pay = "var-anchor-y";
var-pic = "1 - min(1, floor(2 * var-q))";
var-bdk = "min(1, 4 * min(var-q, 1 - var-q))";
var-quad = 0;
@include "win-cause/parts/themed-flat.conf"
