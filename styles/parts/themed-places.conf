# Not a style: where a window starts and ends in a change, for the themed styles (paper,
# cards, ink, origami, step-back). Frozen, as picom runs a script once more at an
# interruption. var-cross is 1 for a window that starts on another monitor than the one
# it ends on.
@include "win-cause/parts/tile-start.conf"
@include "win-cause/parts/tile-end.conf"
var-cx0 = "var-x0 + var-w0 / 2";
var-cy0 = "var-y0 + var-h0 / 2";
var-cx1 = "var-x1 + var-w1 / 2";
var-cy1 = "var-y1 + var-h1 / 2";
var-dcx = "var-cx1 - var-cx0";
var-dcy = "var-cy1 - var-cy0";
var-cross = "min(1, max(0, ceil(max(max(window-monitor-x - var-cx0, var-cx0 - window-monitor-x - window-monitor-width), max(window-monitor-y - var-cy0, var-cy0 - window-monitor-y - window-monitor-height)))))";
