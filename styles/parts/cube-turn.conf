# Not a style: a window that opens or closes in cube.conf. It is the front of a box as deep
# as it is wide along the turn, and the box turns var-a: 0 shows the window at its place,
# pi / 2 has it edge on at its line (plugin-win-cause-line-*), or with no line at its top
# edge. The box turns about its axis behind the window's middle, and stays back just so
# far that its nearest edge is at the screen, so the window is never drawn larger than it
# is: that edge slides along the screen between the line and the far side, as the corner
# of a turning box does, while the other edge goes back. The part of the box behind a
# neighbour is cut away: the window shows only within its place.
@include "win-cause/parts/tile-settings.conf"
var-far = "plugin-win-cause-line-far";
var-line = "plugin-win-cause-line * (1 - var-far * (1 - var-far-line))";
# 1 for an upright line (0 wide), about which the box turns sideways.
var-vert = "var-line * (1 - min(1, ceil(plugin-win-cause-line-width)))";
var-pic = 0;
var-hw = "var-pw / 2";
var-hh = "var-ph / 2";
# The picture's middle, where it sits in its place as tile's does.
var-mx = "window-x + var-anchor-x * (window-width - var-pw) + var-hw";
var-my = "window-y + var-anchor-y * (window-height - var-ph) + var-hh";
# The side the line is on: -1 left (or top), 1 right (or bottom); with no line, the top.
var-lx = "2 * min(1, max(0, ceil(plugin-win-cause-line-x - window-x - window-width / 2))) - 1";
var-ly = "2 * min(1, max(0, ceil(plugin-win-cause-line-y - window-y - window-height / 2))) - 1";
var-ls = "var-line * (var-vert * var-lx + (1 - var-vert) * var-ly) - (1 - var-line)";
# Half the box's depth: half the window along the turn.
var-r = "var-vert * var-hw + (1 - var-vert) * var-hh";
var-qcx = "var-mx + var-vert * var-ls * var-r * sin(var-a)";
var-qcy = "var-my + (1 - var-vert) * var-ls * var-r * sin(var-a)";
var-cz = "var-r * sin(var-a)";
var-yaw = "var-vert * var-ls * var-a";
var-pitch = "(1 - var-vert) * var-ls * var-a";
var-roll = 0;
var-pu = 0;
var-pv = 0;
var-ex = "var-mx";
var-ey = "var-my";
var-eye = 2;
var-swap-x = 0;
var-swap-y = 0;
var-cut-x = "window-x";
var-cut-y = "window-y";
var-cut-width = "window-width";
var-cut-height = "window-height";
@include "win-cause/parts/cube-face.conf"
