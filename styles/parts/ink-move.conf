# Not a style: the motion of ink.conf for a window that moves. Its picture drains into the
# middle of its box (parts/ink-timing.conf), and the box, in the window's colour, moves to
# its new place; there the newest picture comes out of its middle again.
@include "win-cause/parts/ink-timing.conf"
@include "win-cause/parts/themed-places.conf"
var-rx = "var-x0 + (var-x1 - var-x0) * var-m";
var-ry = "var-y0 + (var-y1 - var-y0) * var-m";
var-rw = "var-w0 + (var-w1 - var-w0) * var-m";
var-rh = "var-h0 + (var-h1 - var-h0) * var-m";
var-zs = 1;
var-zx = 0;
var-zy = 0;
var-ps = "max(0.01, var-out + var-in)";
var-pax = 0.5;
var-pay = 0.5;
# The picture it had going in, its newest coming out.
var-pic = "1 - min(1, floor(2 * var-q))";
var-bdk = 1;
var-quad = 0;
@include "win-cause/parts/themed-flat.conf"
