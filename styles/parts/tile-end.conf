# Not a style: where a window's rectangle ends in a change, as var-x1, var-y1, var-w1 and
# var-h1: where i3 put the window. Frozen, as picom runs a script once more at an
# interruption, with the window's new place.
var-x1 = { duration = "var-length"; reset = true; start = "window-x"; end = "window-x"; };
var-y1 = { duration = "var-length"; reset = true; start = "window-y"; end = "window-y"; };
var-w1 = { duration = "var-length"; reset = true; start = "window-width"; end = "window-width"; };
var-h1 = { duration = "var-length"; reset = true; start = "window-height"; end = "window-height"; };
