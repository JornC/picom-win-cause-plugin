# Not a style: the colour of the fill and the backdrop of the tile style, which
# parts/tile.conf chooses.
# The mean colour of the one-pixel ring just inside i3's frame, opaque, as picom reads it
# when a change starts. None while picom doesn't know it.
var-fill-red = "window-edge-red";
var-fill-green = "window-edge-green";
var-fill-blue = "window-edge-blue";
var-fill-alpha = "window-edge-known";
# The backdrop has the style's colour: the edge of a picture that is still empty is black.
var-bd-red = "var-backdrop-red";
var-bd-green = "var-backdrop-green";
var-bd-blue = "var-backdrop-blue";
var-bd-alpha = "var-backdrop-alpha";
