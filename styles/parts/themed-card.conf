# Not a style: a window drawn as a flat card in 3D, through its corners, for the themed
# styles; with parts/themed-flat.conf, whose var-quad turns it on. The card is var-hw by
# var-hh from its middle (half sizes: the picture's own, or evenly scaled). It turns in the
# screen's plane by var-roll (clockwise), then about a level axis by var-pitch (its bottom
# goes back), then about an upright one by var-yaw (its right side goes back), all about a
# pivot var-pu, var-pv from its middle at var-qcx, var-qcy, var-cz behind the screen. The
# eye is var-eye of its larger side in front of var-ex, var-ey. var-swap-x and var-swap-y
# swap its sides, so a card turned past edge on shows its face the right way round.
var-cos-r = "cos(var-roll)";
var-sin-r = "sin(var-roll)";
var-cos-p = "cos(var-pitch)";
var-sin-p = "sin(var-pitch)";
var-cos-y = "cos(var-yaw)";
var-sin-y = "sin(var-yaw)";
# Where the card's own right and down point after the turn.
var-kux = "var-cos-r * var-cos-y - var-sin-r * var-sin-p * var-sin-y";
var-kuy = "var-sin-r * var-cos-p";
var-kuz = "var-cos-r * var-sin-y + var-sin-r * var-sin-p * var-cos-y";
var-kvx = "0 - var-sin-r * var-cos-y - var-cos-r * var-sin-p * var-sin-y";
var-kvy = "var-cos-r * var-cos-p";
var-kvz = "var-cos-r * var-sin-p * var-cos-y - var-sin-r * var-sin-y";
var-kd = "max(1, var-eye * max(2 * var-hw, 2 * var-hh))";
# Its middle, turned about the pivot.
var-kmx = "var-qcx + var-pu - var-pu * var-kux - var-pv * var-kvx";
var-kmy = "var-qcy + var-pv - var-pu * var-kuy - var-pv * var-kvy";
var-kmz = "var-cz - var-pu * var-kuz - var-pv * var-kvz";
# Where the picture's sides are on the card, from its middle: all of it, unless a style
# sets these after it includes this part.
var-ku0 = "0 - var-hw";
var-ku1 = "var-hw";
var-kv0 = "0 - var-hh";
var-kv1 = "var-hh";
var-ka0x = "(1 - 2 * var-swap-x) * var-ku0 * var-kux";
var-ka0y = "(1 - 2 * var-swap-x) * var-ku0 * var-kuy";
var-ka0z = "(1 - 2 * var-swap-x) * var-ku0 * var-kuz";
var-ka1x = "(1 - 2 * var-swap-x) * var-ku1 * var-kux";
var-ka1y = "(1 - 2 * var-swap-x) * var-ku1 * var-kuy";
var-ka1z = "(1 - 2 * var-swap-x) * var-ku1 * var-kuz";
var-kb0x = "(1 - 2 * var-swap-y) * var-kv0 * var-kvx";
var-kb0y = "(1 - 2 * var-swap-y) * var-kv0 * var-kvy";
var-kb0z = "(1 - 2 * var-swap-y) * var-kv0 * var-kvz";
var-kb1x = "(1 - 2 * var-swap-y) * var-kv1 * var-kvx";
var-kb1y = "(1 - 2 * var-swap-y) * var-kv1 * var-kvy";
var-kb1z = "(1 - 2 * var-swap-y) * var-kv1 * var-kvz";
# Each corner of the picture, as the eye sees it.
var-ktlk = "var-kd / (var-kd + var-kmz + var-ka0z + var-kb0z)";
var-ktrk = "var-kd / (var-kd + var-kmz + var-ka1z + var-kb0z)";
var-kblk = "var-kd / (var-kd + var-kmz + var-ka0z + var-kb1z)";
var-kbrk = "var-kd / (var-kd + var-kmz + var-ka1z + var-kb1z)";
var-ktlx = "var-ex + (var-kmx + var-ka0x + var-kb0x - var-ex) * var-ktlk";
var-ktly = "var-ey + (var-kmy + var-ka0y + var-kb0y - var-ey) * var-ktlk";
var-ktrx = "var-ex + (var-kmx + var-ka1x + var-kb0x - var-ex) * var-ktrk";
var-ktry = "var-ey + (var-kmy + var-ka1y + var-kb0y - var-ey) * var-ktrk";
var-kblx = "var-ex + (var-kmx + var-ka0x + var-kb1x - var-ex) * var-kblk";
var-kbly = "var-ey + (var-kmy + var-ka0y + var-kb1y - var-ey) * var-kblk";
var-kbrx = "var-ex + (var-kmx + var-ka1x + var-kb1x - var-ex) * var-kbrk";
var-kbry = "var-ey + (var-kmy + var-ka1y + var-kb1y - var-ey) * var-kbrk";
# Where picom puts the corners before these move them: after offset and scale.
var-kol = "window-x + offset-x";
var-kot = "window-y + offset-y";
var-kor = "var-kol + scale-x * window-width";
var-kob = "var-kot + scale-y * window-height";
corner-top-left-x = "var-quad * (var-ktlx - var-kol)";
corner-top-left-y = "var-quad * (var-ktly - var-kot)";
corner-top-right-x = "var-quad * (var-ktrx - var-kor)";
corner-top-right-y = "var-quad * (var-ktry - var-kot)";
corner-bottom-left-x = "var-quad * (var-kblx - var-kol)";
corner-bottom-left-y = "var-quad * (var-kbly - var-kob)";
corner-bottom-right-x = "var-quad * (var-kbrx - var-kor)";
corner-bottom-right-y = "var-quad * (var-kbry - var-kob)";
