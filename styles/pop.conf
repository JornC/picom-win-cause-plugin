# Pop: a window that opens grows out of its middle at its own proportions, from var-from of
# its size, and fades in over the first half; one that closes shrinks into its middle and
# fades out. A window whose first picture is still empty pops in as a box of its colour
# (the backdrop of parts/tile.conf). Windows that move do so as in tile.conf.
#
# For the rule of tile.conf, in its place; tile-geometry.conf stays. Length and colours are
# tile's (parts/tile.conf).
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  var-pass = 0;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-rect.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  var-pass = 0;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-rect.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/first-picture.conf"
  @include "win-cause/parts/tile-settings.conf"
  var-from = 0.3;
  var-s = { curve = "cubic-bezier(0.2, 0.8, 0.3, 1)"; duration = "var-length"; start = "var-from"; end = 1; reset = true; };
  var-fade = { duration = "var-length / 2"; start = 0; end = 1; reset = true; };
  opacity = "window-raw-opacity * var-fade";
  @include "win-cause/parts/pop.conf"
  crop-x = "window-x + offset-x";
  crop-y = "window-y + offset-y";
  crop-width = "var-s * window-image-width";
  crop-height = "var-s * window-image-height";
  backdrop = "var-backdrop * var-bd-alpha";
  backdrop-red = "var-bd-red";
  backdrop-green = "var-bd-green";
  backdrop-blue = "var-bd-blue";
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  @include "win-cause/parts/tile-settings.conf"
  var-from = 0.3;
  var-s = { curve = "cubic-bezier(0.7, 0, 0.8, 0.2)"; duration = "var-length"; start = 1; end = "var-from"; reset = true; };
  var-fade = { curve = "cubic-bezier(0.5, 0, 1, 1)"; duration = "var-length"; start = 1; end = 0; reset = true; };
  opacity = "window-mapped-opacity * var-fade";
  @include "win-cause/parts/pop.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "var-length";
  @include "win-cause/parts/cover.conf"
});
