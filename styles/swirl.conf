# Two windows spiral into the point halfway between them, spinning and shrinking, and
# spiral back out at each other's place. window-*-before is only true on the first frame,
# so the start values are frozen in timing functions whose start and end are the same. The
# end values are frozen too: at an interruption picom runs this script once more with the
# window's new geometry, so a variable that reads it live would carry a wrong place.
#
# var-length is how long it takes in seconds, var-turns how often the windows circle,
# var-spin how often each one spins (whole numbers), var-pinch how late they shrink, and
# var-smallest how small they get.
#
# A second swirl during this one goes on from where the window is. Anything else that
# interrupts it starts from the window's own place, so to keep a swirl from being cut
# short, add for example suppressions = ["moved-by-close"];
#
# The trigger is yours to name, the plugin doesn't know what a swirl is:
#
#     animation-triggers = ["swirl"];
#     rules = ({
#       animations = ({
#         @include "win-cause/swirl.conf"
#       });
#     });
#
# A command that moves windows then says why:
#
#     win-cause run swirl -- i3-msg swap container with mark swap
triggers = ["swirl"];
var-length = 1.0;
var-turns = 1;
var-spin = 2;
var-pinch = 0.8;
var-smallest = 0.03;
var-swirl = 1;
var-p = { curve = "cubic-bezier(0.4, 0, 0.6, 1)"; duration = "var-length"; start = 0; end = 1; reset = true; };
var-r = "abs(1 - 2 * var-p)";
var-s = "max(var-smallest, var-r ^ var-pinch)";
var-cx0 = { duration = "var-length"; reset = true; start = "var-swirl-before * var-cx-before + (1 - var-swirl-before) * (window-x-before + window-width-before / 2)"; end = "var-swirl-before * var-cx-before + (1 - var-swirl-before) * (window-x-before + window-width-before / 2)"; };
var-cy0 = { duration = "var-length"; reset = true; start = "var-swirl-before * var-cy-before + (1 - var-swirl-before) * (window-y-before + window-height-before / 2)"; end = "var-swirl-before * var-cy-before + (1 - var-swirl-before) * (window-y-before + window-height-before / 2)"; };
var-w0 = { duration = "var-length"; reset = true; start = "var-swirl-before * 2 * var-hw-before + (1 - var-swirl-before) * window-width-before"; end = "var-swirl-before * 2 * var-hw-before + (1 - var-swirl-before) * window-width-before"; };
var-h0 = { duration = "var-length"; reset = true; start = "var-swirl-before * 2 * var-hh-before + (1 - var-swirl-before) * window-height-before"; end = "var-swirl-before * 2 * var-hh-before + (1 - var-swirl-before) * window-height-before"; };
var-phi0 = { duration = "var-length"; reset = true; start = "var-swirl-before * var-phi-before"; end = "var-swirl-before * var-phi-before"; };
var-cx1 = { duration = "var-length"; reset = true; start = "window-x + window-width / 2"; end = "window-x + window-width / 2"; };
var-cy1 = { duration = "var-length"; reset = true; start = "window-y + window-height / 2"; end = "window-y + window-height / 2"; };
var-w1 = { duration = "var-length"; reset = true; start = "window-width"; end = "window-width"; };
var-h1 = { duration = "var-length"; reset = true; start = "window-height"; end = "window-height"; };
var-dx = "(var-cx0 - var-cx1) / 2";
var-dy = "(var-cy0 - var-cy1) / 2";
var-th = "pi * (1 + 2 * var-turns) * var-p";
var-cx = "(var-cx0 + var-cx1) / 2 + var-r * (var-dx * cos(var-th) - var-dy * sin(var-th))";
var-cy = "(var-cy0 + var-cy1) / 2 + var-r * (var-dx * sin(var-th) + var-dy * cos(var-th))";
var-hw = "(var-w0 + (var-w1 - var-w0) * var-p) * var-s / 2";
var-hh = "(var-h0 + (var-h1 - var-h0) * var-p) * var-s / 2";
var-phi = "var-phi0 * (1 - var-p) + 2 * pi * var-spin * var-p";
var-c = "cos(var-phi)";
var-n = "sin(var-phi)";
corner-top-left-x = "var-cx - var-hw * var-c + var-hh * var-n - window-x";
corner-top-left-y = "var-cy - var-hw * var-n - var-hh * var-c - window-y";
corner-top-right-x = "var-cx + var-hw * var-c + var-hh * var-n - window-x - window-width";
corner-top-right-y = "var-cy + var-hw * var-n - var-hh * var-c - window-y";
corner-bottom-left-x = "var-cx - var-hw * var-c - var-hh * var-n - window-x";
corner-bottom-left-y = "var-cy - var-hw * var-n + var-hh * var-c - window-y - window-height";
corner-bottom-right-x = "var-cx + var-hw * var-c - var-hh * var-n - window-x - window-width";
corner-bottom-right-y = "var-cy + var-hw * var-n + var-hh * var-c - window-y - window-height";
saved-image-blend = { duration = "var-length"; start = 1; end = 0; };
# i3 restacks the two windows at each swap: the one in front stays in front while they overlap.
keep-stacking = 1;
