# Cards: windows are cards on a table. A card that moves lifts a little, slides and drops
# (parts/cards-move.conf); one that goes to another monitor is flicked with a short spin.
# Two that trade places turn over like cards, through flip.conf. One that opens is dealt
# in from the top left corner of its monitor with a quarter turn. One that closes is
# turned face down (its back is its picture mirrored and dark) and slides off downwards.
#
# For the rule of tile.conf, in its place, with cards-geometry.conf in the rule of
# tile-geometry.conf. A swap shows nothing beforehand, so its flip is a trigger of its own,
# in a rule of its own, as in flip.conf:
#
#     animation-triggers = ["flip"];
#     rules = (..., {
#       match = "!override_redirect && window_type = 'normal'";
#       animations = ({
#         @include "win-cause/flip.conf"
#       });
#     });
#
#     bindsym $mod+s exec --no-startup-id win-cause run flip -- i3-msg swap container with mark swap
#
# Needs a picom with the corner outputs, back-face and dim. A lifted card has no shadow: a
# rule can't give a window one only while it moves. Length is tile's (parts/tile.conf); a
# move or an open takes 1.4 times as long, a close 1.6 times.
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  @include "win-cause/parts/cards-move.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  @include "win-cause/parts/cards-move.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/first-picture.conf"
  @include "win-cause/parts/tile-settings.conf"
  @include "win-cause/parts/themed-card-base.conf"
  var-deal = { curve = "cubic-bezier(0.2, 0.7, 0.3, 1)"; duration = "1.4 * var-length"; start = 0; end = 1; reset = true; };
  var-pic = 0;
  var-hw = "(0.5 + 0.5 * var-deal) * var-pw / 2";
  var-hh = "(0.5 + 0.5 * var-deal) * var-ph / 2";
  var-qcx = "window-monitor-x + (window-x + var-pw / 2 - window-monitor-x) * var-deal";
  var-qcy = "window-monitor-y + (window-y + var-ph / 2 - window-monitor-y) * var-deal";
  var-ex = "var-qcx";
  var-ey = "var-qcy";
  var-pu = 0;
  var-pv = 0;
  var-cz = 0;
  var-yaw = 0;
  var-pitch = 0;
  var-roll = "0 - pi / 2 * (1 - var-deal)";
  var-eye = 2;
  var-swap-x = 0;
  var-swap-y = 0;
  opacity = "window-raw-opacity * min(1, 8 * var-deal)";
  blur-opacity = "opacity";
  @include "win-cause/parts/themed-flat.conf"
  @include "win-cause/parts/themed-card.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  @include "win-cause/parts/tile-settings.conf"
  @include "win-cause/parts/themed-card-base.conf"
  var-q = { duration = "1.6 * var-length"; start = 0; end = 1; reset = true; };
  var-turn = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; duration = "0.45 * 1.6 * var-length"; start = 0; end = 1; reset = true; };
  var-off = { curve = "cubic-bezier(0.5, 0, 0.9, 0.6)"; delay = "0.45 * 1.6 * var-length"; duration = "0.55 * 1.6 * var-length"; start = 0; end = 1; reset = true; };
  var-pic = 0;
  var-hw = "var-pw / 2";
  var-hh = "var-ph / 2";
  var-qcx = "window-x + var-hw";
  var-qcy = "window-y + var-hh + var-off * (window-monitor-y + window-monitor-height - window-y + 20)";
  var-ex = "window-x + var-hw";
  var-ey = "window-y + var-hh";
  var-pu = 0;
  var-pv = 0;
  var-pitch = 0;
  var-roll = 0;
  # Half a turn: past edge on, its back shows.
  var-yaw = "pi * var-turn";
  var-cz = "var-hw * abs(sin(var-yaw))";
  var-eye = 2;
  var-swap-x = 0;
  var-swap-y = 0;
  back-face = 1;
  dim = "0.7 * min(1, max(0, ceil(var-turn - 0.5)))";
  # A closed window's own opacity is 0.
  opacity = "window-mapped-opacity * min(1, 4 * (1 - var-q))";
  blur-opacity = "opacity";
  @include "win-cause/parts/themed-flat.conf"
  @include "win-cause/parts/themed-card.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "1.6 * var-length";
  @include "win-cause/parts/cover.conf"
});
