# Cube: windows are the faces of boxes that turn, as the workspaces in ws-direction's
# cube.conf. Two windows that trade places are two sides of one box between them: they
# fold into its near corner, it turns a quarter, and it opens out flat with them traded.
# A window that changes place and size rolls a quarter turn about its edge in the way it
# goes, as a box tipping onto its next side, which comes down at the new place; one that
# goes to another monitor tips over toward it so. One whose new place overlaps its old
# one turns over in place, half a turn about its middle (parts/cube-move.conf). One that opens
# turns into view from its split line, a quarter turn of a box; one that closes turns
# away into it (parts/cube-turn.conf).
#
# For the rule of tile.conf, in its place, with cube-geometry.conf in the rule of
# tile-geometry.conf: a swap is a geometry change, told by the window's size, which it
# keeps. Goes with ws-direction's cube.conf for workspace switches. Needs a picom with the
# corner outputs. Length is tile's (parts/tile.conf); a change takes 1.5 times as long.
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  # These make room or take it: they roll, also when they keep their size.
  var-swaps = 0;
  @include "win-cause/parts/cube-move.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  var-swaps = 0;
  @include "win-cause/parts/cube-move.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/first-picture.conf"
  var-f = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; duration = "1.5 * var-length"; start = 0; end = 1; reset = true; };
  var-a = "pi / 2 * (1 - var-f)";
  @include "win-cause/parts/cube-turn.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  var-f = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; duration = "1.5 * var-length"; start = 0; end = 1; reset = true; };
  var-a = "pi / 2 * var-f";
  # A closed window's own opacity is 0.
  opacity = "window-mapped-opacity";
  @include "win-cause/parts/cube-turn.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "1.5 * var-length";
  @include "win-cause/parts/cover.conf"
});
