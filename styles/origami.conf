# Origami: windows are hinged panels. A window that changes size turns half a turn as it
# moves and lands showing its face; two that trade places fold over like the sides of a
# box; one that goes to another monitor folds away there and unfolds here
# (parts/origami-move.conf). One that opens unfolds out of its split line, one that closes
# folds away into it (parts/fold.conf, as fold.conf).
#
# For the rule of tile.conf, in its place, with origami-geometry.conf in the rule of
# tile-geometry.conf. Needs a picom with the corner outputs. Length is tile's
# (parts/tile.conf); a change takes 1.5 times as long.
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  @include "win-cause/parts/origami-move.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  @include "win-cause/parts/origami-move.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/first-picture.conf"
  @include "win-cause/parts/tile-settings.conf"
  var-f = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; duration = "1.5 * var-length"; start = 0; end = 1; reset = true; };
  var-a = "pi / 2 * (1 - var-f)";
  # A window with no line turns about its top edge, a panel hinged there.
  var-lone-turn = 1;
  @include "win-cause/parts/fold.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  @include "win-cause/parts/tile-settings.conf"
  var-f = { curve = "cubic-bezier(0.42, 0, 0.58, 1)"; duration = "1.5 * var-length"; start = 0; end = 1; reset = true; };
  var-a = "pi / 2 * var-f";
  var-lone-turn = 1;
  # A closed window's own opacity is 0.
  opacity = "window-mapped-opacity";
  @include "win-cause/parts/fold.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "1.5 * var-length";
  @include "win-cause/parts/cover.conf"
});
