# Spring: tile.conf on a damped spring (parts/spring.conf). Each rectangle goes a little
# past its place and settles back. Windows that open and close grow and shrink on the same
# spring, so the edges they share with their neighbours stay shared.
#
# For the rule of tile.conf, in its place, with spring-geometry.conf in the rule of
# tile-geometry.conf. The other settings are tile's (parts/tile.conf).
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  var-pass = 0;
  @include "win-cause/parts/spring.conf"
  @include "win-cause/parts/tile-rect.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  var-pass = 0;
  @include "win-cause/parts/spring.conf"
  @include "win-cause/parts/tile-rect.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/spring.conf"
  @include "win-cause/parts/tile-open.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  @include "win-cause/parts/spring.conf"
  @include "win-cause/parts/tile-close.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  # Its curve, here too, makes this last as long as a move.
  @include "win-cause/parts/spring.conf"
  var-cover-time = "var-length";
  @include "win-cause/parts/cover.conf"
});
