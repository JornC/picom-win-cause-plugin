# Tile: windows move as rectangles. When i3 moves windows, each window's rectangle goes
# from where it was to where it is, and all windows of one change move on one curve, at
# one time, starting and ending without speed, so the edges they share stay together. The
# window manager's frame is drawn on the rectangle's edges. The content inside it is
# never scaled or blended: it is drawn at its own size, cut where it is larger than the
# inside of the frame, and the part that it doesn't cover is filled with the median
# colour of the content, its background, as opaque as that is. A window that opens grows
# out of the line it split from (plugin-win-cause-line-*), and one that closes goes back
# into it.
#
# This file is for the rule that matches every normal window, also floating ones: a
# window that turns floating is floating by the time it moves. tile-geometry.conf is the
# same motion for moves that the plugin can't explain (resize, swap, move, layout,
# floating off), for a rule that leaves floating windows out, so a mouse drag isn't
# slowed:
#
#     plugins = ["win-cause.so"];
#     rules = ({
#       match = "!override_redirect && window_type = 'normal'";
#       @include "win-cause/tile.conf"
#     }, {
#       match = "!override_redirect && window_type = 'normal' && !I3_FLOATING_WINDOW@";
#       @include "win-cause/tile-geometry.conf"
#     });
#
# Needs the win-cause plugin, and a picom with window-image-width, fill, window-median-red
# (or window-edge-red), frame-on-crop, saved-image-own-size and keep-stacking. The
# settings (how long, the curve, what an interruption does, the fill and its colour, where
# the picture sits when it doesn't fit, what a window with no split line does, and one
# whose line is its far side, which picture is drawn) are in parts/tile.conf; copy it to
# win-cause/parts/ next to picom.conf to change them. The plugin says which lines are a
# window's far side rather than a split line it shares with its neighbours
# (plugin-win-cause-line-far); this style moves both alike unless var-far-line is 0.
# No window comes in front of a moving one that it overlaps until they are apart or the
# move ends, so a raise that i3 means, such as a floating window over a window that turns
# tiled, shows then.
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  # These windows make room or take it, and pass no other: they go straight.
  var-pass = 0;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-rect.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  var-pass = 0;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-rect.conf"
  depth = 0;
}, {
  triggers = ["open"];
  var-curve = "var-ease";
  @include "win-cause/parts/tile-open.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-close.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "var-length";
  @include "win-cause/parts/cover.conf"
});
