# Step back: a camera that pulls back. In any change, every window of it is drawn smaller
# around the middle of its monitor, places and all, so the whole set shrinks together;
# the windows move while it is back, and it comes forward again
# (parts/step-back-camera.conf). One that opens fades in while the camera is back, one
# that closes fades out. Windows are scaled evenly, never stretched.
#
# For the rule of tile.conf, in its place, with step-back-geometry.conf in the rule of
# tile-geometry.conf. Length and colours are tile's (parts/tile.conf); a change takes 1.6
# times as long.
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  @include "win-cause/parts/step-back-move.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  @include "win-cause/parts/step-back-move.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/first-picture.conf"
  @include "win-cause/parts/step-back-camera.conf"
  var-rx = "window-x";
  var-ry = "window-y";
  var-rw = "window-width";
  var-rh = "window-height";
  var-ps = 1;
  var-pax = "var-anchor-x";
  var-pay = "var-anchor-y";
  var-pic = 0;
  var-bdk = 1;
  var-quad = 0;
  opacity = "window-raw-opacity * var-fade";
  blur-opacity = "opacity";
  @include "win-cause/parts/themed-flat.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  @include "win-cause/parts/step-back-camera.conf"
  var-rx = "window-x";
  var-ry = "window-y";
  var-rw = "window-width";
  var-rh = "window-height";
  var-ps = 1;
  var-pax = "var-anchor-x";
  var-pay = "var-anchor-y";
  var-pic = 0;
  var-bdk = 1;
  var-quad = 0;
  # A closed window's own opacity is 0.
  opacity = "window-mapped-opacity * (1 - var-fade)";
  blur-opacity = "opacity";
  @include "win-cause/parts/themed-flat.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "1.6 * var-length";
  @include "win-cause/parts/cover.conf"
});
