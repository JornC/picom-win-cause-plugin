# Fold: a window that closes folds away in 3D, turning a quarter turn back about the line
# it goes back into (plugin-win-cause-line-*) until it is seen edge on, as the windows that
# take its place reach it; one that opens unfolds out of its line as they make room. A
# window with no line has nothing to fold into: it grows out of and shrinks into a point
# as in tile.conf (var-lone-to), evenly scaled, on the same curve. On the quarter-turn
# curve its edge stays a little ahead of the tile rectangles of its neighbours, so no gap
# opens between them. Windows that move do so as in tile.conf.
#
# For the rule of tile.conf, in its place; tile-geometry.conf stays. Needs a picom with the
# corner outputs. Length and curve are tile's (parts/tile.conf).
animations = ({
  triggers = ["moved-by-open", "moved-by-close", "moved-by-float"];
  var-pass = 0;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-rect.conf"
}, {
  # The window that goes fullscreen, or back, moves as the others, in front of the
  # windows it covers or uncovers (parts/cover.conf puts them farther).
  triggers = ["moved-by-fullscreen"];
  var-pass = 0;
  var-curve = "var-ease";
  @include "win-cause/parts/tile-rect.conf"
  depth = 0;
}, {
  triggers = ["open"];
  @include "win-cause/parts/first-picture.conf"
  @include "win-cause/parts/tile-settings.conf"
  var-a = "pi / 2 * (1 - var-ease)";
  var-lone-turn = 0;
  @include "win-cause/parts/fold.conf"
}, {
  triggers = ["close"];
  # In front of the windows it uncovers, if it was fullscreen (parts/cover.conf).
  depth = 0;
  @include "win-cause/parts/tile-settings.conf"
  var-a = "pi / 2 * var-ease";
  var-lone-turn = 0;
  # A closed window's own opacity is 0.
  opacity = "window-mapped-opacity";
  @include "win-cause/parts/fold.conf"
}, {
  # The windows that a window going fullscreen, or back, covers or uncovers stay as
  # they are while it moves.
  triggers = ["covered-by-fullscreen", "uncovered-by-fullscreen"];
  @include "win-cause/parts/tile-settings.conf"
  var-cover-time = "var-length";
  @include "win-cause/parts/cover.conf"
});
