# Card flip: two windows that trade places turn over like cards on the way, each about an
# upright axis through its middle, and land at the other's place. Past edge on, the card
# shows the window's face again, the right way round, as a card with the same face on both
# sides, so nothing jumps at the end. Its near edge stays at the screen and its far edge
# goes back, in perspective (the eye var-eye of the window's larger side away), so it is
# never drawn larger than it is. A window going right turns its right edge back first.
# The picture is drawn at its own size; windows of different sizes keep the size of their
# picture on the way. It turns away with the picture it had when the swap started and
# comes back with its newest from edge on. Until the program drew its new size, picom's
# newest is the old one, so a slower program's new picture comes as soon as it drew.
#
# A swap shows nothing beforehand, so a command says why, as for swirl.conf. In a rule of
# its own, next to those of tile.conf, which every other change keeps:
#
#     animation-triggers = ["flip"];
#     rules = (..., {
#       match = "!override_redirect && window_type = 'normal'";
#       animations = ({
#         @include "win-cause/flip.conf"
#       });
#     });
#
#     bindsym $mod+m mark --toggle swap
#     bindsym $mod+s exec --no-startup-id win-cause run flip -- i3-msg swap container with mark swap
#
# Needs a picom with the corner outputs. Length and curve are tile's (parts/tile.conf).
triggers = ["flip"];
@include "win-cause/parts/tile-settings.conf"
var-eye = 2;
@include "win-cause/parts/tile-start.conf"
@include "win-cause/parts/tile-end.conf"
# The card's middle goes from the old place's to the new one's.
var-cx = "var-x0 + var-w0 / 2 + (var-x1 + var-w1 / 2 - var-x0 - var-w0 / 2) * var-ease";
var-cy = "var-y0 + var-h0 / 2 + (var-y1 + var-h1 / 2 - var-y0 - var-h0 / 2) * var-ease";
# The angle: 0 to a quarter turn, then from a quarter turn the other way back to 0, which is
# a half turn with the face on both sides.
var-dir = "1 - 2 * min(1, max(0, ceil(var-x0 - var-x1)))";
var-b = "pi * var-dir * (var-ease - round(var-ease))";
var-c = "cos(var-b)";
var-n = "sin(var-b)";
# 1 for the picture it had when the swap started, until edge on, then 0 for its newest.
var-pic = "1 - min(1, floor(2 * var-ease))";
var-pw = "var-pic * window-saved-image-width + (1 - var-pic) * window-image-width";
var-ph = "var-pic * window-saved-image-height + (1 - var-pic) * window-image-height";
saved-image-blend = "var-pic";
saved-image-own-size = 1;
var-hw = "var-pw / 2";
var-hh = "var-ph / 2";
var-d = "var-eye * max(var-pw, var-ph)";
# How far each side edge is behind the screen, as the eye sees it.
var-kl = "var-d / (var-d + var-hw * (abs(var-n) - var-n))";
var-kr = "var-d / (var-d + var-hw * (abs(var-n) + var-n))";
scale-x = "window-image-width / window-width";
scale-y = "window-image-height / window-height";
corner-top-left-x = "var-cx - var-hw * var-c * var-kl - window-x";
corner-top-left-y = "var-cy - var-hh * var-kl - window-y";
corner-top-right-x = "var-cx + var-hw * var-c * var-kr - window-x - window-image-width";
corner-top-right-y = "var-cy - var-hh * var-kr - window-y";
corner-bottom-left-x = "var-cx - var-hw * var-c * var-kl - window-x";
corner-bottom-left-y = "var-cy + var-hh * var-kl - window-y - window-image-height";
corner-bottom-right-x = "var-cx + var-hw * var-c * var-kr - window-x - window-image-width";
corner-bottom-right-y = "var-cy + var-hh * var-kr - window-y - window-image-height";
